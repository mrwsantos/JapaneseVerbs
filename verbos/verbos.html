<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Verbos Japoneses — 動詞</title>
<meta name="theme-color" content="#6b47ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japonês SRS">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/app-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/app-192.png">
<style>
:root{
  --bg:#f8f7fb; --card:#ffffff; --text:#1c1a24; --sub:#6c6879;
  --accent:#6b47ea; --accent2:#4c24df; --border:#e4e1ec; --chip:#efedf7;
  --shadow:0 1px 2px rgba(30,20,60,.04), 0 8px 24px rgba(30,20,60,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#17151f; --card:#221f2c; --text:#efeef5; --sub:#a29dae; --accent:#8768f0; --accent2:#7f97f8; --border:#37334a; --chip:#2a2736; --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.3); } }
:root[data-theme="dark"]{ --bg:#17151f; --card:#221f2c; --text:#efeef5; --sub:#a29dae; --accent:#8768f0; --accent2:#7f97f8; --border:#37334a; --chip:#2a2736; --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.3); }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
@font-face{font-family:"Roboto Mono";src:url('../fonts/RobotoMono-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:"Roboto Mono";src:url('../fonts/RobotoMono-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
body{background:var(--bg);color:var(--text);font-family:"Roboto Mono",ui-monospace,-apple-system,"Hiragino Sans",sans-serif;display:flex;flex-direction:column;min-height:100%;-webkit-font-smoothing:antialiased}
input,select,textarea{font-family:inherit}
button{font:inherit;color:inherit;background:none;border:none;-webkit-appearance:none;appearance:none;cursor:pointer}
button,.pill,.tab,.mode{transition:background-color .15s ease,color .15s ease,border-color .15s ease,transform .18s cubic-bezier(.34,1.56,.64,1)}
button:active,.pill:active,.tab:active,.mode:active{transform:scale(.96);transition-duration:.08s}
body,.card,.list-item,.modal,header,.write-input,.search-input,.badge{transition:background-color .25s ease,color .25s ease,border-color .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{opacity:0;transform:scale(.88)}65%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
header{position:relative;padding:16px 16px calc(12px + env(safe-area-inset-top,0px));text-align:center;border-bottom:1px solid var(--border)}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:7px}
.logo-icon{width:20px;height:20px;border-radius:5px;vertical-align:-5px}
:root[data-theme="dark"] .logo-icon{filter:invert(1) hue-rotate(180deg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-icon{filter:invert(1) hue-rotate(180deg)}}
.theme-btn{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));font-size:16px;padding:4px 8px;border-radius:8px}
.theme-btn:hover{background:var(--chip)}
.home-btn{position:absolute;left:14px;top:calc(15px + env(safe-area-inset-top,0px));width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:var(--chip);color:var(--sub);text-decoration:none;transition:background-color .15s ease,color .15s ease,transform .18s cubic-bezier(.34,1.56,.64,1)}
.home-btn:hover{background:var(--accent);color:#fff}
.home-btn:active{transform:scale(.92)}
.stats-btn{left:auto;right:54px}
@media (max-width:380px){ header .app-switch a{padding:6px 9px} }
.app-switch{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--chip)}
.app-switch a{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub);text-decoration:none;transition:background-color .15s ease,color .15s ease}
.app-switch a .jp{font-weight:600;opacity:.85}
.app-switch a.active{background:var(--accent);color:#fff}
.tabs{display:flex;gap:6px;padding:12px 12px;overflow-x:auto; min-height: 60px;}
.tab{flex:1;text-align:center;padding:9px 6px;border-radius:10px;background:var(--chip);color:var(--sub);font-size:13px;font-weight:600;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff}
.modes{display:flex;gap:6px;padding:0 16px 10px;max-width:480px;margin:0 auto;width:100%}
.mode{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;text-align:center;padding:8px 4px;border-radius:20px;border:1px solid var(--border);color:var(--sub);font-size:12px;font-weight:600}
.mode.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
main{flex:1;padding:8px 16px calc(92px + env(safe-area-inset-bottom,0px) + var(--kb,0px));max-width:480px;margin:0 auto;width:100%}
.stats{display:flex;justify-content:space-around;margin:6px 0 16px;font-size:12px;color:var(--sub)}
.stats b{color:var(--text);font-size:16px;display:block}
.card{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:20px;padding:32px 20px;text-align:center;min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer;width:100%;animation:fadeInUp .3s cubic-bezier(.16,1,.3,1)}
.card.nohand{cursor:default}
.group-tag{display:inline-block;font-size:11px;color:var(--sub);background:var(--chip);padding:2px 8px;border-radius:20px}
.tag-row{display:flex;justify-content:center;align-items:center;gap:6px;margin:0 auto 6px}
.kanji{font-size:34px;font-weight:600}
.kana{font-size:16px;color:var(--sub)}
.sentence{font-size:24px;font-weight:600;line-height:1.4}
.meaning-big{font-size:24px;font-weight:600}
.answer{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);animation:fadeIn .35s ease}
.romaji{font-size:15px;color:var(--sub)}
.meaning{font-size:19px;font-weight:600;margin-top:4px}
.hint{font-size:12px;color:var(--sub);margin-top:14px}
.actions{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px) + var(--kb,0px));display:flex;gap:10px;max-width:480px;margin:0 auto;padding:0 16px;box-sizing:border-box;z-index:10}
.btn{flex:1;padding:14px 0;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.btn.no{background:#f5d6d2;color:#8a2c20}
.btn.yes{background:#d3ecdc;color:#1f5c38}
.btn.next{background:var(--chip);color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.no{background:#4a2621;color:#f5b8ae} :root:not([data-theme="light"]) .btn.yes{background:#20402c;color:#9fe0b8}}
:root[data-theme="dark"] .btn.no{background:#4a2621;color:#f5b8ae}
:root[data-theme="dark"] .btn.yes{background:#20402c;color:#9fe0b8}
.write-input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;margin-top:14px;text-align:center}
.write-input:focus,.search-input:focus{outline:none;border-color:var(--accent)}
.search-row{display:flex;gap:8px;align-items:center;margin:4px 0 14px}
.search-box{position:relative;flex:1}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px}
.search-input{width:100%;padding:12px 14px 12px 36px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;text-align:left}
.info-btn{flex-shrink:0;width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:18px}
.info-btn:hover{background:var(--chip);color:var(--text)}
.group-header{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin:18px 4px 6px;text-align:left}
.group-header:first-of-type{margin-top:4px}
.group-header .chevron{font-size:10px;color:var(--sub);transition:transform .2s ease}
.group-header .chevron.collapsed{transform:rotate(180deg)}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,15,35,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fadeIn .18s ease}
.modal{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;text-align:left;box-shadow:var(--shadow);animation:modalIn .25s cubic-bezier(.16,1,.3,1)}
.modal h2{margin:0 0 14px;font-size:16px}
.modal h2:not(:first-child){margin-top:22px}
.modal h3{margin:16px 0 4px;font-size:14px;display:flex;align-items:center;gap:7px}
.modal h3:first-of-type{margin-top:0}
.modal p{margin:2px 0;font-size:13px;color:var(--sub);line-height:1.6}
.modal-divider{border:none;border-top:1px solid var(--border);margin:20px 0 0}
.modal-close{display:block;width:100%;margin-top:18px;padding:12px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:14px}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--chip);color:var(--sub);font-size:12px;cursor:pointer}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tags{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.tagbadge{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--sub);transition:.15s}
.tagbadge.formal{background:#e7def7;color:#6b3aa8}
.tagbadge.informal{background:#dceee4;color:#28724a}
.tagbadge.time{background:#dceaf7;color:#2f6094}
.tagbadge.neg{background:#f6dfd9;color:#a04432}
.tagbadge.shuffle{background:#eee0b8;color:#80620b}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tagbadge.formal{background:#342647;color:#d0a9f0}
  :root:not([data-theme="light"]) .tagbadge.informal{background:#203c2c;color:#9fdfb8}
  :root:not([data-theme="light"]) .tagbadge.time{background:#213449;color:#9fc4e8}
  :root:not([data-theme="light"]) .tagbadge.neg{background:#432923;color:#efaaa0}
  :root:not([data-theme="light"]) .tagbadge.shuffle{background:#40371f;color:#e8cf7e}
}
:root[data-theme="dark"] .tagbadge.formal{background:#342647;color:#d0a9f0}
:root[data-theme="dark"] .tagbadge.informal{background:#203c2c;color:#9fdfb8}
:root[data-theme="dark"] .tagbadge.time{background:#213449;color:#9fc4e8}
:root[data-theme="dark"] .tagbadge.neg{background:#432923;color:#efaaa0}
:root[data-theme="dark"] .tagbadge.shuffle{background:#40371f;color:#e8cf7e}
.subtle{font-size:11px;color:var(--sub);margin-top:2px;margin-bottom:6px}
.result-ok{color:#1f5c38;font-weight:700;display:inline-block;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
.result-no{color:#8a2c20;font-weight:700;display:inline-block;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.newlimit{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--sub);margin:-6px 0 10px}
.newlimit select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:3px 6px}
.know-btn{display:block;margin:12px auto 0;padding:8px 14px;border-radius:20px;border:1px solid var(--border);color:var(--sub);font-size:13px;font-weight:600}
.know-btn:hover{background:var(--chip);color:var(--text)}
.list-item{display:block;width:100%;text-align:left;padding:12px 10px;border-bottom:1px solid var(--border);font-size:14px;animation:fadeIn .3s ease both;cursor:pointer}
.group-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1)}
.group-body.collapsed{grid-template-rows:0fr}
.group-body-inner{overflow:hidden;min-height:0}
.list-item .row{display:flex;justify-content:space-between;align-items:center}
.list-item .l-kanji-row{display:flex;align-items:center;gap:6px}
.list-item .l-kanji{font-size:17px}
.list-item .l-meaning{color:var(--sub);font-size:12px}
.tts-btn-sm{width:22px;height:22px;font-size:11px}
.badges{display:flex;gap:6px;align-items:center}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge.g1{background:#e4ecf7;color:#2a5599}
.badge.g2{background:#f7e9e4;color:#a05a2a}
.badge.g3{background:#eee0f7;color:#7a2ea0}
.badge.nivel-N5{background:#daf3e4;color:#1f7a4c}
.badge.nivel-N4{background:#dbe7fb;color:#2a5599}
.badge.nivel-N3{background:#fdf0d5;color:#a06b0a}
.badge.nivel-N2{background:#fbe3d3;color:#a3521f}
.badge.nivel-N1{background:#ede3fc;color:#6b3aa8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.g1{background:#1f2c40;color:#9ab8ea} :root:not([data-theme="light"]) .badge.g2{background:#3a2a20;color:#e8b48c} :root:not([data-theme="light"]) .badge.g3{background:#332040;color:#d3a8ea}
  :root:not([data-theme="light"]) .badge.nivel-N5{background:#1f3a2c;color:#9fe0b8} :root:not([data-theme="light"]) .badge.nivel-N4{background:#1f2c40;color:#9ab8ea} :root:not([data-theme="light"]) .badge.nivel-N3{background:#3a2a14;color:#e8c477} :root:not([data-theme="light"]) .badge.nivel-N2{background:#3a2416;color:#f0b78c} :root:not([data-theme="light"]) .badge.nivel-N1{background:#342647;color:#d0a9f0}}
:root[data-theme="dark"] .badge.g1{background:#1f2c40;color:#9ab8ea}
:root[data-theme="dark"] .badge.g2{background:#3a2a20;color:#e8b48c}
:root[data-theme="dark"] .badge.g3{background:#332040;color:#d3a8ea}
:root[data-theme="dark"] .badge.nivel-N5{background:#1f3a2c;color:#9fe0b8}
:root[data-theme="dark"] .badge.nivel-N4{background:#1f2c40;color:#9ab8ea}
:root[data-theme="dark"] .badge.nivel-N3{background:#3a2a14;color:#e8c477}
:root[data-theme="dark"] .badge.nivel-N2{background:#3a2416;color:#f0b78c}
:root[data-theme="dark"] .badge.nivel-N1{background:#342647;color:#d0a9f0}
.badge.new{background:var(--chip);color:var(--sub)}
.badge.learning{background:#fdf0d5;color:#a06b0a}
.badge.learned{background:#d3ecdc;color:#1f5c38}
.conj{width: 100%;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:13px}
.conj-row{display:flex;justify-content:space-between;padding:4px 0}
.conj-row .lbl{color:var(--sub)}
.conj-speak{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;cursor:pointer}
.conj-speak:hover{text-decoration-color:var(--sub)}
.conj-speak:active{opacity:.7}
.kanji-toggle{text-decoration:underline;text-underline-offset:7px;text-decoration-color:var(--accent);cursor:pointer}
.kanji-toggle:hover{text-decoration-color:var(--accent)}
.kanji-row{display:flex;align-items:center;justify-content:center;position:relative}
.kanji-row .tts-btn{position:absolute;left:100%;top:50%;margin-left:8px;transform:translateY(-50%)}
.kanji-row .tts-btn:active{transform:translateY(-50%) scale(.92)}
.tts-btn{flex:none;width:30px;height:30px;padding:0;border:none;border-radius:50%;background:var(--chip);color:var(--sub);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tts-btn:hover{background:var(--accent);color:#fff}
.tts-btn:active{transform:scale(.92)}
.fq-sentence-row{display:flex;align-items:center;justify-content:center;gap:8px}
.reset{display:block;margin:20px auto 0;font-size:12px;color:var(--sub);background:none;border:none;text-decoration:underline;cursor:pointer}
.session{margin:2px 0 14px}
.session-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.counts{display:flex;gap:10px;font-size:11px;color:var(--sub)}
.counts b{color:var(--text);font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.dot.new{background:#8aa4f0}.dot.learning{background:#e8b04a}.dot.learned{background:#4fb57a}
.settings-btn{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--sub);flex:0 0 auto;min-width:150px;white-space:nowrap}
.settings-btn span:first-child{overflow:hidden;text-overflow:ellipsis}
.settings-btn:hover{color:var(--text)}
.progress{flex:1;min-width:28px;height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:99px;transition:width .35s cubic-bezier(.16,1,.3,1)}
.session-sub{font-size:11px;color:var(--sub);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.deck-pos{font-weight:600;color:var(--accent);font-size:24px}
.flip-wrap{position:relative;perspective:1200px;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .25s ease,opacity .25s ease;animation:cardIn .35s cubic-bezier(.16,1,.3,1)}
.flip-wrap.dragging{transition:none}
.flip-wrap.leaving{opacity:0}
.flip{display:grid;cursor:pointer;transition:transform .45s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;outline:none;border-radius:20px}
.flip:focus-visible .face{box-shadow:0 0 0 3px var(--accent)}
.flip.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:20px;padding:32px 20px;min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .tag-row{margin-bottom:4px}
.face-sub{font-size:12px;color:var(--sub)}
.face .answer{width:100%}
.swipe-tag{position:absolute;top:18px;padding:4px 10px;border-radius:8px;font-weight:700;font-size:13px;opacity:0;transition:opacity .1s;pointer-events:none;border:2px solid;background:var(--card)}
.swipe-tag.left{left:18px;color:#c0503f;border-color:#c0503f;transform:rotate(-8deg)}
.swipe-tag.right{right:18px;color:#2f8f57;border-color:#2f8f57;transform:rotate(8deg)}
.flip-wrap[data-swipe="left"] .swipe-tag.left,.flip-wrap[data-swipe="right"] .swipe-tag.right{opacity:1}
.card-hint{text-align:center;font-size:11px;color:var(--sub);margin-top:10px;min-height:14px}
.flip-actions{transition:opacity .2s ease,transform .2s ease}
/* Escrita: estatística do fim do deck */
.es-card{align-items:stretch;text-align:left;gap:4px;padding:22px 18px}
.es-title{font-size:15px;font-weight:700;text-align:center}
.es-big{font-size:40px;font-weight:700;text-align:center;color:var(--accent);line-height:1.1;margin-top:4px}
.es-card > .es-hint{text-align:center}
.es-hint{font-size:12px;color:var(--sub);font-weight:400}
.es-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:14px 0 4px}
.es-row{display:grid;grid-template-columns:1fr 90px 34px;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.es-bar{height:8px;border-radius:8px;background:var(--chip);overflow:hidden}
.es-bar > div{height:100%;background:linear-gradient(90deg,#e0897d,#d9584a);border-radius:8px}
.es-num{font-size:12px;color:var(--sub);text-align:right}
.es-words{list-style:none;margin:0;padding:0;font-size:14px}
.es-words li{padding:4px 0;border-bottom:1px dashed var(--border)}
.es-words b{float:right;color:#d9584a}

<script>
const VERBS = VERBS_RAW.map((v,i)=>({id:i,...v}));

const GROUP_NAME = {1:"Grupo 1 · Godan",2:"Grupo 2 · Ichidan",3:"Grupo 3 · Irregular / する"};
const GROUP_BADGE = {1:"G1",2:"G2",3:"G3"};
const INTERVALS = [0,1,3,7,14,30,60];
try{ localStorage.setItem("jp-last-app", "verbos"); }catch(e){}
const KEY = "jpverbs-progress-v2";

function loadProgress(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
// old=true: progresso importado (o histórico não conta como "aprendido hoje").
function saveProgress(p, old){ try{ localStorage.setItem(KEY, JSON.stringify(p)); }catch(e){} Historico.sync("v", p, old); }
let progress = loadProgress();

const THEME_KEY = "jp-theme";
function loadTheme(){ try{ return localStorage.getItem(THEME_KEY) || localStorage.getItem("jpverbs-theme") || 'auto'; }catch(e){ return 'auto'; } }
function applyTheme(mode){
  if(mode==='light') document.documentElement.setAttribute('data-theme','light');
  else if(mode==='dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
}
let themeMode = loadTheme();
applyTheme(themeMode);
// Trocar o tema e o backup ficam no botão de configurações (../config.js).

// Frases: começa só em hiragana; o botão no card (ou os Ajustes) liga o kanji.
// Vale para verbos e adjetivos.
const KANJI_KEY = "jp-frase-kanji";
function loadKanjiPref(){ try{ return localStorage.getItem(KANJI_KEY)==='1'; }catch(e){ return false; } }
function saveKanjiPref(v){ try{ localStorage.setItem(KANJI_KEY, v ? '1' : '0'); }catch(e){} }
function toggleKanji(){ state.showKanji = !state.showKanji; saveKanjiPref(state.showKanji); render(); }

function applyDefaultSeed(){
  const APRENDIDO_ROMAJI = ["iku","taberu","nomu"];
  const PRATICANDO_ROMAJI = ["yomu","kuru","kaeru"];
  VERBS.forEach(v=>{
    if(APRENDIDO_ROMAJI.includes(v.romaji)){
      progress[v.id] = {level:4, fraseHits:2, due: today()+14};
    } else if(PRATICANDO_ROMAJI.includes(v.romaji)){
      progress[v.id] = {level:2, fraseHits:0, due: today()+3};
    }
  });
  saveProgress(progress, true); // palavras iniciais não contam como "aprendidas hoje"
}
const SEED_FLAG = "jpverbs-seeded-v3";
if(!localStorage.getItem(SEED_FLAG)){
  applyDefaultSeed();
  localStorage.setItem(SEED_FLAG, "1");
}
Historico.sync("v", progress);
function getEntry(id){ if(!progress[id]) progress[id] = {level:0, due:0, fraseHits:0}; if(progress[id].fraseHits===undefined) progress[id].fraseHits=0; return progress[id]; }
function today(){ return Math.floor(Date.now()/86400000); }
function getStatus(v){
  const e = progress[v.id];
  if(!e || e.level<2) return 'novo';
  if(e.level<4 || e.fraseHits<2) return 'praticando';
  return 'aprendido';
}

const GODAN_MAP = {
 'う':{nai:'わ',i:'い',te:'って',ta:'った'}, 'く':{nai:'か',i:'き',te:'いて',ta:'いた'},
 'ぐ':{nai:'が',i:'ぎ',te:'いで',ta:'いだ'}, 'す':{nai:'さ',i:'し',te:'して',ta:'した'},
 'つ':{nai:'た',i:'ち',te:'って',ta:'った'}, 'ぬ':{nai:'な',i:'に',te:'んで',ta:'んだ'},
 'ぶ':{nai:'ば',i:'び',te:'んで',ta:'んだ'}, 'む':{nai:'ま',i:'み',te:'んで',ta:'んだ'},
 'る':{nai:'ら',i:'り',te:'って',ta:'った'}
};
function conjugate(v){
  const k = v.kana;
  if(v.group===1){
    const stem = k.slice(0,-1), last = k.slice(-1), m = GODAN_MAP[last];
    const isIku = k==="いく";
    const isAru = k==="ある";
    const ta = isIku ? "った" : m.ta;
    const te = isIku ? "って" : m.te;
    // ある é irregular só na negativa: "ない"/"なかった", nunca "あらない"/"あらなかった".
    const nai = isAru ? "ない" : stem+m.nai+"ない";
    const nakatta = isAru ? "なかった" : stem+m.nai+"なかった";
    return { dict:k, masu:stem+m.i+"ます", nai:nai, masen:stem+m.i+"ません",
      te:stem+te, ta:stem+ta, mashita:stem+m.i+"ました", nakatta:nakatta, masendeshita:stem+m.i+"ませんでした" };
  }
  if(v.group===2){
    const stem = k.slice(0,-1);
    return { dict:k, masu:stem+"ます", nai:stem+"ない", masen:stem+"ません",
      te:stem+"て", ta:stem+"た", mashita:stem+"ました", nakatta:stem+"なかった", masendeshita:stem+"ませんでした" };
  }
  if(k==="くる"){
    return { dict:"くる", masu:"きます", nai:"こない", masen:"きません",
      te:"きて", ta:"きた", mashita:"きました", nakatta:"こなかった", masendeshita:"きませんでした" };
  }
  const prefix = k.slice(0,-2);
  return { dict:prefix+"する", masu:prefix+"します", nai:prefix+"しない", masen:prefix+"しません",
    te:prefix+"して", ta:prefix+"した", mashita:prefix+"しました", nakatta:prefix+"しなかった", masendeshita:prefix+"しませんでした" };
}


function conjSpeakHtml(text){
  return TTS.available() ? `<span class="conj-speak" data-tts="${escapeAttr(text)}">${text}</span>` : `<span>${text}</span>`;
}
function conjRowsHtml(c){
  return `<div class="conj-row"><span class="lbl">Informal (dic.)</span>${conjSpeakHtml(c.dict)}</div>
    <div class="conj-row"><span class="lbl">Formal</span>${conjSpeakHtml(c.masu)}</div>
    <div class="conj-row"><span class="lbl">Forma Te</span>${conjSpeakHtml(c.te)}</div>
    <div class="conj-row"><span class="lbl">Negativo informal</span>${conjSpeakHtml(c.nai)}</div>
    <div class="conj-row"><span class="lbl">Negativo formal</span>${conjSpeakHtml(c.masen)}</div>
    <div class="conj-row"><span class="lbl">Passado informal</span>${conjSpeakHtml(c.ta)}</div>
    <div class="conj-row"><span class="lbl">Passado formal</span>${conjSpeakHtml(c.mashita)}</div>
    <div class="conj-row"><span class="lbl">Passado neg. informal</span>${conjSpeakHtml(c.nakatta)}</div>
    <div class="conj-row"><span class="lbl">Passado neg. formal</span>${conjSpeakHtml(c.masendeshita)}</div>`;
}

function ptForm(v, past, neg){
  const base = past ? v.ptPast : v.ptPresent;
  if(!neg) return base;
  if(base.includes('-me')) return 'não me ' + base.replace('-me','');
  return 'não ' + base;
}

const H = {'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
'や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'wo','ん':'n'};
const YOON = {'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho','ちゃ':'cha','ちゅ':'chu','ちょ':'cho',
'にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo',
'りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo','じゃ':'ja','じゅ':'ju','じょ':'jo',
'びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo'};
function kanaToRomaji(str){
  let out='', i=0;
  while(i<str.length){
    const c=str[i], next=str[i+1], combo=c+(next||'');
    if(c==='っ'){
      const nextCombo = next+(str[i+2]||'');
      const nr = YOON[nextCombo] || H[next] || '';
      if(nr) out += nr[0];
      i++; continue;
    }
    if(YOON[combo]){ out+=YOON[combo]; i+=2; continue; }
    out += H[c] || c; i++;
  }
  return out;
}

function normRomaji(s){ return s.toLowerCase().trim().replace(/\s+/g,""); }

// Aceitar respostas em hiragana, katakana ou kanji além de romaji.
function katakanaToHiragana(s){ return s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)); }
function kanjiOkuriganaLen(v){
  let n = 0;
  for(let i=v.kanji.length-1; i>=0; i--){
    const code = v.kanji.charCodeAt(i);
    if(code>=0x3041 && code<=0x3096) n++; else break;
  }
  return n;
}
function kanjiFormFor(v, kanaForm){
  if(v.kana==="くる") return "来"+kanaForm.slice(1);
  if(v.kanji===v.kana) return kanaForm;
  const n = kanjiOkuriganaLen(v);
  const kanaRoot = v.kana.slice(0, v.kana.length-n);
  const kanjiRoot = v.kanji.slice(0, v.kanji.length-n);
  if(kanaForm.startsWith(kanaRoot)) return kanjiRoot + kanaForm.slice(kanaRoot.length);
  return kanaForm;
}
function matchesWrittenAnswer(rawInput, targetKana, targetRomaji, targetKanji){
  const input = rawInput.trim();
  if(!input) return false;
  if(normRomaji(input) === normRomaji(targetRomaji)) return true;
  const inputAsHiragana = katakanaToHiragana(input);
  if(inputAsHiragana === targetKana) return true;
  if(input === targetKanji) return true;
  return false;
}

let state = {tab:"study", mode:"cards", queue:[], idx:0, deckIds:[], deckWrongIds:[], reviewIds:[], reviewWrongIds:[], reviewEnd:0, revealed:false, exampleFor:null, answerConjFor:null, expanded:null, writeChecked:false, writeOk:false, testMode:false,
  writeFilter:{polite:'informal', past:false, neg:false, shuffle:false}, shuffledFilter:null,
  writeGroup: 'all',
  search:'', learningSearch:'', groupExpanded:{1:false,2:false,3:false}, showGroupInfo:false, showLearningInfo:false,
  showKanji: loadKanjiPref(), cardGroupFilter:'all', nivelFilter:'all', groupCollapsed:{1:false,2:false,3:false}};

function targetKey(f){
  if(f.polite==='informal'){
    if(!f.past && !f.neg) return 'dict';
    if(!f.past && f.neg) return 'nai';
    if(f.past && !f.neg) return 'ta';
    return 'nakatta';
  }
  if(!f.past && !f.neg) return 'masu';
  if(!f.past && f.neg) return 'masen';
  if(f.past && !f.neg) return 'mashita';
  return 'masendeshita';
}
function randomFilter(){
  return { polite: Math.random()<0.5?'informal':'formal', past: Math.random()<0.5, neg: Math.random()<0.5 };
}
function toggleFilter(kind){
  const f = state.writeFilter;

  if(kind==='formal'){
    f.polite = 'formal';
    f.shuffle = false;
    state.shuffledFilter = null;
  } else if(kind==='informal'){
    f.polite = 'informal';
    f.shuffle = false;
    state.shuffledFilter = null;
  } else if(kind==='past'){
    f.past = !f.past;
    f.shuffle = false;
    state.shuffledFilter = null;
  } else if(kind==='neg'){
    f.neg = !f.neg;
    f.shuffle = false;
    state.shuffledFilter = null;
  } else if(kind==='shuffle'){
    f.shuffle = !f.shuffle;
    state.shuffledFilter = f.shuffle ? randomFilter() : null;
  }

  render();
}

// ===== Palavras novas por dia =====
// Limite compartilhado entre verbos e adjetivos; o contador de novas vistas
// hoje é de cada app. "Nova" = nunca respondida (due 0).
//
// DECISÃO (2026-10-13): o limite diário era escolhido pelo usuário nos
// Ajustes (10/20/30/50/sem limite). Virou fixo em 2 lotes (NEW_DECK_SIZE*2)
// porque, com as palavras novas entrando em lotes de 10, o controle manual
// por lote ("Próximo lote") já pausa o ritmo — o seletor de limite diário
// ficou redundante. Se no futuro fizer falta escolher outro valor, reabilitar
// é voltar ao histórico do git (commit que introduziu esta decisão) e
// restaurar NEW_LIMIT_KEY/NEW_LIMIT_OPTIONS/loadNewLimit/setNewLimit.
const NEW_DECK_SIZE = 10;
const newLimit = NEW_DECK_SIZE * 2; // fixo, não configurável (ver decisão acima)
const NEW_TODAY_KEY = "jpverbs-new-today";
function loadNewToday(){ try{ const d = JSON.parse(localStorage.getItem(NEW_TODAY_KEY)); if(d && d.day===today()) return d; }catch(e){} return {day:today(), count:0, extra:0}; }
let newToday = loadNewToday();
function touchNewToday(){ if(newToday.day!==today()) newToday = {day:today(), count:0, extra:0}; return newToday; }
function saveNewToday(){ try{ localStorage.setItem(NEW_TODAY_KEY, JSON.stringify(newToday)); }catch(e){} }
function isNew(v){ const e = progress[v.id]; return !e || e.due===0; }
function newSlotsLeft(){ const d = touchNewToday(); return newLimit===0 ? Infinity : Math.max(0, newLimit + d.extra - d.count); }
function moreNew(){ touchNewToday().extra += 10; saveNewToday(); buildQueue(); render(); }

// ===== Revisões por dia (evita a pilha de quem fica dias sem abrir) =====
// - No máximo REVIEW_LIMIT revisões novas por dia, primeiro as de nível mais
//   baixo e mais atrasadas; o resto fica para os próximos dias (+15 libera mais).
// - Com mais de NEW_PAUSE_AT revisões pendentes, o lote de palavras novas
//   pausa até a pilha baixar (dá para forçar).
// - Só a 1ª resposta do dia a uma revisão mexe no nível: errou desce 2 níveis
//   (em vez de zerar); repetições no mesmo dia não sobem nem descem.
const REVIEW_LIMIT = 30, NEW_PAUSE_AT = 30, REVIEW_EXTRA = 15;
const REVIEWS_TODAY_KEY = "jpverbs-reviews-today";
function loadReviewsToday(){ try{ const d = JSON.parse(localStorage.getItem(REVIEWS_TODAY_KEY)); if(d && d.day===today() && Array.isArray(d.ids)) return d; }catch(e){} return {day:today(), ids:[], extra:0}; }
let reviewsToday = loadReviewsToday();
function touchReviewsToday(){ if(reviewsToday.day!==today()) reviewsToday = {day:today(), ids:[], extra:0}; return reviewsToday; }
function saveReviewsToday(){ try{ localStorage.setItem(REVIEWS_TODAY_KEY, JSON.stringify(reviewsToday)); }catch(e){} }
function reviewSlotsLeft(){ const d = touchReviewsToday(); return Math.max(0, REVIEW_LIMIT + d.extra - d.ids.length); }
function moreReviews(){ touchReviewsToday().extra += REVIEW_EXTRA; saveReviewsToday(); buildQueue(); render(); }
function forceNewDeck(){ state.forceNew = true; buildQueue(); render(); }
function cardPool(){ return state.cardGroupFilter==='all' ? VERBS : VERBS.filter(v=>v.group===state.cardGroupFilter); }

// O lote (deckIds/deckWrongIds) fica salvo pra sobreviver a trocar de app
// (verbos ↔ adjetivos é navegação de página, zera qualquer variável em
// memória) e a fechar/reabrir o navegador no meio de um lote.
const DECK_KEY = "jpverbs-deck";
function loadDeck(){ try{ const d = JSON.parse(localStorage.getItem(DECK_KEY)); if(d && Array.isArray(d.deckIds) && Array.isArray(d.deckWrongIds)) return d; }catch(e){} return {deckIds:[], deckWrongIds:[]}; }
function saveDeck(){ try{ localStorage.setItem(DECK_KEY, JSON.stringify({deckIds: state.deckIds, deckWrongIds: state.deckWrongIds})); }catch(e){} }

// Embaralha (Fisher-Yates): a escolha das palavras segue a prioridade, mas a
// ordem em que aparecem muda a cada rodada.
function shuffled(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildQueue(){
  const t = today();
  if(state.mode==="cards"){
    // Revisões vencidas primeiro, depois um lote de até 10 novas (as mais
    // comuns primeiro), respeitando o limite diário. Cada palavra do lote
    // aparece uma vez nesse passe; as erradas vão para `deckWrongIds` e, ao
    // fim do passe, formam um lote menor só com elas (ver continueDeck()),
    // repetindo até não restar nenhum erro — só então libera o próximo lote.
    //
    // Se já existe um lote salvo (de uma sessão/app anterior) com palavras
    // ainda não respondidas neste passe (due===0) ou erradas pendentes,
    // retoma ele em vez de sortear um lote novo.
    const pool = cardPool();
    // Revisões: as já respondidas hoje (repetição) não gastam o limite; das
    // outras entram até reviewSlotsLeft(), nível mais baixo e mais atrasadas primeiro.
    const rt = touchReviewsToday();
    const due = pool.filter(v=> !isNew(v) && getEntry(v.id).due <= t);
    const again = due.filter(v=> rt.ids.includes(v.id));
    const fresh = due.filter(v=> !rt.ids.includes(v.id))
      .sort((a,b)=> (getEntry(a.id).level - getEntry(b.id).level) || (getEntry(a.id).due - getEntry(b.id).due));
    const reviews = shuffled(again.concat(fresh.slice(0, reviewSlotsLeft())));
    state.reviewsLeft = fresh.length - (reviews.length - again.length);
    state.newPaused = !state.forceNew && fresh.length > NEW_PAUSE_AT;
    state.reviewIds = reviews.map(w=>w.id);
    state.reviewWrongIds = [];
    state.reviewEnd = reviews.length; // queue[0..reviewEnd) = passe de revisões
    const saved = loadDeck();
    const savedPending = saved.deckIds.filter(id=> VERBS[id] && getEntry(id).due===0);
    // Uma errada do lote pode já ter sido corrigida pela revisão (devido
    // hoje) antes de reabrir o "Continuar" — não precisa repetir de novo.
    const stillWrong = saved.deckWrongIds.filter(id=> VERBS[id] && getEntry(id).due <= t);
    if(savedPending.length > 0 || stillWrong.length > 0){
      state.deckIds = saved.deckIds;
      state.deckWrongIds = stillWrong;
      state.queue = reviews.concat(savedPending.map(id=>VERBS[id]));
      if(stillWrong.length !== saved.deckWrongIds.length) saveDeck();
    } else {
      // Mais comuns primeiro; entre as de mesma popularidade, sorteia.
      const newsPool = shuffled(pool.filter(isNew)).sort((a,b)=> (a.freq||99) - (b.freq||99));
      const news = state.newPaused ? [] : shuffled(newsPool.slice(0, Math.min(NEW_DECK_SIZE, newSlotsLeft())));
      state.queue = reviews.concat(news);
      state.deckIds = news.map(w=>w.id);
      state.deckWrongIds = [];
      saveDeck();
    }
  } else if(state.mode==="escrita"){
    state.writePool = VERBS.filter(v=>{ const e=progress[v.id]; return e && e.level>=2 && (state.writeGroup==='all' || v.group===state.writeGroup); }).map(v=>v.id).sort(()=>Math.random()-0.5);
    state.writeCursor = 0;
    const ids = state.writePool.slice(0, Escrita.DECK);
    state.writeCursor = ids.length;
    state.queue = ids.map((id)=> VERBS[id]);
    state.writeDeckSize = ids.length;
    state.writeAttempts = [];
    state.writeCarry = [];
    state.deckIds = [];
    state.deckWrongIds = [];
    state.reviewIds = [];
    state.reviewWrongIds = [];
    state.reviewEnd = 0;
  } else {
    state.queue = VERBS.filter(v=>{ const e=progress[v.id]; return e && e.level>=2; }).sort(()=>Math.random()-0.5);
    state.deckIds = [];
    state.deckWrongIds = [];
    state.reviewIds = [];
    state.reviewWrongIds = [];
    state.reviewEnd = 0;
  }
  state.idx = 0; state.revealed = false; state.writeChecked=false;
  Frases.reset();
}

// ===== Modo Escrita: decks de 10 + estatística (lógica comum em ../escrita.js) =====
// As palavras em Praticando/Aprendido são embaralhadas e servidas em decks
// de Escrita.DECK; errou, a palavra volta no fim do deck até acertar. No fim
// de cada deck aparece a estatística dos erros (Escrita.summaryHtml).
function nextWriteDeck(){
  if(state.writeCursor >= state.writePool.length){ state.writePool.sort(()=>Math.random()-0.5); state.writeCursor = 0; }
  const ids = state.writePool.slice(state.writeCursor, state.writeCursor + Escrita.DECK);
  state.writeCursor += ids.length;
  const carry = (state.writeCarry||[]).filter((id)=> !ids.includes(id));
  state.writeCarry = [];
  ids.push(...carry);
  state.queue = ids.map((id)=> VERBS[id]);
  state.writeDeckSize = ids.length;
  state.writeAttempts = [];
  state.idx = 0; state.writeChecked = false;
  state.shuffledFilter = state.writeFilter.shuffle ? randomFilter() : null;
  render();
}
// Filtro de grupo da Escrita (salvo no aparelho).
const WRITE_GROUP_KEY = "jpverbs-write-group";
const parseWriteGroup = (g)=> g==='all' ? 'all' : Number(g);
function loadWriteGroup(){ try{ return parseWriteGroup(localStorage.getItem(WRITE_GROUP_KEY) || 'all'); }catch(e){ return 'all'; } }
function setWriteGroup(g){ state.writeGroup = g; try{ localStorage.setItem(WRITE_GROUP_KEY, String(g)); }catch(e){} buildQueue(); render(); }
// "Próximo deck só com <grupo>": botão da estatística (chave de groupOf).
function trainWriteGroup(key){ setWriteGroup(parseWriteGroup(String(key).replace(/^g/, ''))); }
// "Próximo deck só com essa forma": fixa as formas da Escrita na que mais errou.
function trainWriteForm(key){
  const F = Escrita.FORM[key];
  state.writeFilter = {polite: F.f ? 'formal' : 'informal', past: !!F.p, neg: !!F.n, shuffle: false};
  nextWriteDeck();
}
state.writeGroup = loadWriteGroup();
Escrita.setup({
  words: VERBS,
  statsKey: "jpverbs-write-stats",
  forms(v){
    const c = conjugate(v), out = {};
    for(const k of Object.keys(Escrita.FORM)){
      const kanas = [c[k]];
      out[k] = [...kanas, ...kanas.map((x)=> kanjiFormFor(v, x))];
    }
    return out;
  },
  groupOf: (v)=> ({key: 'g' + v.group, label: GROUP_NAME[v.group]}),
  hint: (k)=> ({dict:'〜う / 〜る', masu:'〜ます', nai:'〜ない', masen:'〜ません', ta:'〜た / 〜だ', mashita:'〜ました', nakatta:'〜なかった', masendeshita:'〜ませんでした'})[k],
});

// ===== Modo Frases (lógica comum em ../frases.js) =====
// Frases do verbo (a principal + frasesExtra), com o verbo conjugado na
// lacuna. Em português troca a palavra destacada (hl ou ptPresent) pelo
// passado (hlPast ou ptPast) e/ou põe "não" antes.
function verbBlank(w, key){ const k = conjugate(w)[key]; return {ans: kanjiFormFor(w, k), ansK: k}; }
function verbVariants(v){
  return [{f: v.fraseFront, k: v.fraseFrontKana, pt: v.fraseBack, hl: v.fraseHl, hlPast: v.fraseHlPast},
    ...(v.frasesExtra||[]).map(([f, k, pt, hl, hlPast])=> ({f, k, pt, hl, hlPast}))];
}
Frases.setup({
  words: VERBS,
  variants: verbVariants,
  keys: (v, s)=> Frases.FUTURE.test(s.f + s.pt) ? Frases.PRESENT : Frases.KEYS,
  item(v, key, s){
    const b = verbBlank(v, key), F = Frases.FORM[key];
    const word = s.hl || v.ptPresent;
    const repl = F.p ? (s.hl ? s.hlPast : v.ptPast) : word;
    const pt = Frases.ptVerb(s.pt, word, repl || word, !!F.n) || s.pt;
    return {pre: s.f, post: "。", preK: s.k, postK: "。", ans: b.ans, ansK: b.ansK, pt};
  },
  blank: (w, key)=> verbBlank(w, key),
  conjugate: conjugate,
  kind: (w)=> w.group,
  studied: (w)=> { const e = progress[w.id]; return !!e && e.level >= 2; },
  // Errou: a palavra volta no fim da rodada (com outra frase/forma sorteada).
  score(v, ok){ fraseScore(v, ok); if(!ok) state.queue.push(v); },
  next(){ state.idx++; render(); },
  render: ()=> render(),
  showKanji: ()=> state.showKanji,
  toggleKanji: "toggleKanji",
});
// Posição da carta atual dentro do lote (ex.: "Card 2/10") ou das revisões
// da rodada (ex.: "Revendo 1/13"); null fora do modo Cards.
function deckPosition(){
  if(state.mode==='escrita') return state.idx < state.queue.length ? {label:'', pos: state.idx+1, total: state.queue.length} : null;
  if(state.mode!=='cards') return null;
  const v = state.queue[state.idx];
  if(!v) return null;
  if(state.idx < state.reviewEnd) return {label:'Revendo', pos: state.idx - (state.reviewEnd - state.reviewIds.length) + 1, total: state.reviewIds.length};
  const i = state.deckIds.indexOf(v.id);
  if(i!==-1) return {label:'Card', pos: i+1, total: state.deckIds.length};
  return null;
}
// Revisões erradas também formam uma rodada menor só com elas, logo depois
// do passe de revisões e antes das novas, até zerar os erros.
function continueReviews(){
  const ids = shuffled(state.reviewWrongIds);
  state.reviewWrongIds = [];
  state.reviewIds = ids.slice();
  state.queue.splice(state.idx, 0, ...ids.map(id=>VERBS[id]));
  state.reviewEnd = state.idx + ids.length;
  state.revealed = false;
  render();
}
// Depois de passar por todo o lote, um novo lote (menor) com só as palavras
// erradas, até zerar os erros.
function continueDeck(){
  state.deckIds = shuffled(state.deckWrongIds);
  state.deckWrongIds = [];
  state.queue = state.deckIds.map(id=>VERBS[id]);
  state.reviewEnd = 0;
  state.idx = 0; state.revealed = false; state.writeChecked=false;
  saveDeck();
  render();
}
function setCardGroupFilter(g){ state.cardGroupFilter = g; buildQueue(); render(); }

function answer(correct){
  const v = state.queue[state.idx]; const e = getEntry(v.id);
  const inReview = state.idx < state.reviewEnd;
  if(e.due===0){ touchNewToday().count++; saveNewToday(); }
  const rt = touchReviewsToday();
  if(inReview && !state.testMode){
    if(!rt.ids.includes(v.id)){
      // 1ª resposta do dia: acertou sobe 1; errou desce 2 (não zera).
      rt.ids.push(v.id); saveReviewsToday();
      e.level = correct ? Math.min(e.level+1, INTERVALS.length-1) : Math.max(e.level-2, 0);
      e.due = today() + INTERVALS[e.level];
    } else if(correct && e.due <= today()){
      e.due = today() + 1; // repetição certa no mesmo dia: só sai de "hoje"
    }
  } else {
    e.level = correct ? Math.min(e.level+1, INTERVALS.length-1) : 0;
    e.due = state.testMode ? today() : today() + INTERVALS[e.level];
  }
  saveProgress(progress); state.idx++; state.revealed = false;
  if(!state.testMode) Historico.log("v", "cards", v.id, correct);
  if(state.testMode) state.queue.push(v);
  else if(!correct){
    // Errou: se é revisão, entra na rodada de revisões erradas (logo depois
    // do passe de revisões); se é do lote, vira o próximo lote (menor).
    if(inReview){
      state.reviewWrongIds.push(v.id);
      const wi = state.deckWrongIds.indexOf(v.id); // já vai repetir na revisão
      if(wi!==-1) state.deckWrongIds.splice(wi,1);
    }
    else state.deckWrongIds.push(v.id);
  } else {
    // Acertou: se já tinha errado antes no lote (e voltou como revisão antes
    // de abrir o "Continuar"), não precisa repetir — tira da lista.
    const wi = state.deckWrongIds.indexOf(v.id);
    if(wi!==-1) state.deckWrongIds.splice(wi,1);
  }
  saveDeck();
  render();
}
// "Já sei": palavra ainda em Novo que já domino vai direto para Aprendido e só
// volta na revisão de 14 dias. Se nunca tinha sido respondida, não gasta o
// limite de novas: outra nova entra no lugar.
function knowIt(){
  const v = state.queue[state.idx];
  if(!confirm(`Marcar "${v.kanji}" (${v.meaning}) como já aprendida?\nEla só volta em revisão daqui a 14 dias.`)) return;
  const e = getEntry(v.id);
  const wasUnseen = e.due===0;
  e.level = 4; e.due = today() + INTERVALS[4]; e.fraseHits = 2;
  saveProgress(progress); state.idx++; state.revealed = false;
  state.queue = state.queue.filter((w,i)=> i < state.idx || w.id!==v.id);
  const ri = state.reviewWrongIds.indexOf(v.id);
  if(ri!==-1) state.reviewWrongIds.splice(ri,1);
  if(wasUnseen){
    const next = cardPool().filter(w=> isNew(w) && !state.queue.includes(w)).sort((a,b)=> (a.freq||99) - (b.freq||99))[0];
    if(next){ state.queue.push(next); state.deckIds.push(next.id); }
  }
  const wi = state.deckWrongIds.indexOf(v.id);
  if(wi!==-1) state.deckWrongIds.splice(wi,1);
  saveDeck();
  render();
}
function toggleTestMode(){ state.testMode = !state.testMode; render(); }
// Modo Frases: só grava (quem avança é Frases.next()).
function fraseScore(v, correct){
  Historico.log("v", "frases", v.id, correct);
  const e = getEntry(v.id);
  if(correct){
    e.fraseHits = Math.min(e.fraseHits+1, 2);
  } else {
    e.fraseHits = Math.max(e.fraseHits-1, 0);
    // Igual à escrita: nunca derruba o nível a ponto de "desaprender" o verbo.
    e.level = Math.max(e.level-1, 2);
  }
  saveProgress(progress);
}
// "Desistir": mostra a resposta, conta como erro e a palavra sai deste deck
// para o fim do próximo (ver writeNext / nextWriteDeck).
function giveUpWrite(){ checkWrite(true); }
function checkWrite(giveUp){
  const v = state.queue[state.idx];
  // Romaji que sobrou no fim (ex.: "n") vira kana antes de conferir.
  const input = giveUp ? '' : Romaji.toKana(document.getElementById("writeInput").value, true);
  const eff = state.writeFilter.shuffle ? state.shuffledFilter : state.writeFilter;
  const key = targetKey(eff);
  const targetKana = conjugate(v)[key];
  const targetRomaji = kanaToRomaji(targetKana);
  const targetKanji = kanjiFormFor(v, targetKana);
  state.writeOk = matchesWrittenAnswer(input, targetKana, targetRomaji, targetKanji);
  state.writeKey = key; state.writeInputShown = input;
  state.writeErr = state.writeOk ? null : Escrita.classify(v, key, input);
  state.writeTargetKana = targetKana;
  state.writeTargetRomaji = targetRomaji;
  state.writeTargetKanji = targetKanji;
  if(giveUp) state.writeErr = {type: 'desistiu'};
  state.writeGaveUp = !!giveUp;
  state.writeChecked = true; Sons.play('cards', state.writeOk ? 'acerto' : 'erro'); render();
}
function writeNext(correct){
  const v = state.queue[state.idx]; const e = getEntry(v.id);
  // Estatística do deck + histórico; errou, volta no fim do deck.
  state.writeAttempts.push({v, key: state.writeKey, ok: correct, err: state.writeErr});
  Escrita.record(v, state.writeKey, correct);
  Historico.log("v", "escrita", v.id, correct);
  if(!correct){
    if(state.writeGaveUp) state.writeCarry.push(v.id); // desistiu: fim do próximo deck
    else state.queue.push(v);
  }
  state.writeGaveUp = false;
  if(correct){
    e.level = Math.min(e.level+1, INTERVALS.length-1);
    e.due = today() + INTERVALS[e.level];
  } else {
    // Escrita é prática extra: erro não zera o nível (senão o verbo cairia de "Praticando/Aprendido"
    // direto pra "Novo" e sumiria do próprio pool de Escrita, que exige nível >= 2).
    e.level = Math.max(e.level-1, 2);
  }
  saveProgress(progress);
  state.idx++;
  state.writeChecked=false;
  state.shuffledFilter = state.writeFilter.shuffle ? randomFilter() : null;
  render();
}

function counts(){
  let novo=0, praticando=0, aprendido=0;
  VERBS.forEach(v=>{ const s = getStatus(v); if(s==='novo') novo++; else if(s==='praticando') praticando++; else aprendido++; });
  return {novo, praticando, aprendido};
}

// ===== Estudo: direção, ajustes e cards no estilo Anki/Quizlet =====
const DIRECTION_KEY = "jp-direction"; // compartilhado entre verbos e adjetivos
function loadDirection(){ try{ return localStorage.getItem(DIRECTION_KEY)==='pt' ? 'pt' : 'jp'; }catch(e){ return 'jp'; } }
let direction = loadDirection();
function setDirection(d){ direction = d; try{ localStorage.setItem(DIRECTION_KEY, d); }catch(e){} state.revealed = false; render(); }
const DIR_LABEL = {jp:'JP → PT', pt:'PT → JP'};
const CARD_FILTERS = [['all','Todos'],[1,'Grupo 1'],[2,'Grupo 2'],[3,'Grupo 3']];
function setCardFilter(v){ setCardGroupFilter(v); }
function cardFilterValue(){ return state.cardGroupFilter; }
function cardTag(v){ return `<div class="tag-row"><span class="group-tag">${GROUP_NAME[v.group]}</span> <span class="badge nivel-${v.nivel}">${v.nivel}</span></div>`; }

function toggleCardSound(){ const on = !Sons.enabled('cards'); Sons.setEnabled('cards', on); if(on) Sons.play('cards', 'sabia'); render(); }
function openSheet(){ state.sheet = true; state.sheetAnim = true; render(); }
function closeSheet(){ state.sheet = false; render(); }
window.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && state.sheet) closeSheet(); });

function settingsSummary(){
  const parts = [];
  if(state.mode==='cards') parts.push(DIR_LABEL[direction]);
  if(state.mode==='cards'){
    const f = CARD_FILTERS.find(([val])=> val===cardFilterValue());
    if(f && f[0]!=='all') parts.push(f[1]);
    if(state.testMode) parts.push('🧪 teste');
  }
  if(state.mode==='frases') parts.push(state.showKanji ? 'Kanji' : 'Kana', Frases.summary());
  if(state.mode==='escrita'){
    const f = state.writeFilter;
    parts.push(f.shuffle ? '🎲 Embaralhado' : [f.polite==='formal'?'Formal':'Informal', f.past?'Passado':'Presente', f.neg?'Negativo':''].filter(Boolean).join(' · '));
    if(state.writeGroup!=='all'){ const g = CARD_FILTERS.find(([val])=> val===state.writeGroup); if(g) parts.push(g[1]); }
  }
  return parts.join(' · ');
}
function sessionBar(c){
  const total = state.queue.length, done = Math.min(state.idx, total);
  const pct = total ? Math.round(done/total*100) : 0;
  const dp = deckPosition();
  return `<div class="session">
    <div class="session-top">
      <div class="progress" role="progressbar" aria-label="Progresso da rodada" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><div class="progress-bar" style="width:${pct}%"></div></div>
      <button type="button" class="settings-btn" onclick="openSheet()" aria-label="Ajustes"><span>${settingsSummary()}</span></button>
    </div>
    <div class="session-sub">
      <div class="counts"><span><i class="dot new"></i><b>${c.novo}</b> novos</span><span><i class="dot learning"></i><b>${c.praticando}</b> praticando</span><span><i class="dot learned"></i><b>${c.aprendido}</b> aprendidos</span></div>
      ${dp ? `<span class="deck-pos">${dp.label} ${dp.pos}/${dp.total}</span>` : ''}
    </div>
  </div>`;
}
function segHtml(opts, cur, fn){
  return `<div class="seg">${opts.map(([val,label])=>`<button type="button" class="${val===cur?'active':''}" aria-pressed="${val===cur}" onclick='${fn}(${JSON.stringify(val)})'>${label}</button>`).join('')}</div>`;
}
function writePillsHtml(){
  const f = state.writeFilter;
  return `<div class="pillrow">
    <button type="button" class="pill ${f.polite==='informal'&&!f.shuffle?'active':''}" aria-pressed="${f.polite==='informal'&&!f.shuffle}" onclick="toggleFilter('informal')">Informal</button>
    <button type="button" class="pill ${f.polite==='formal'&&!f.shuffle?'active':''}" aria-pressed="${f.polite==='formal'&&!f.shuffle}" onclick="toggleFilter('formal')">Formal</button>
    <button type="button" class="pill ${f.past&&!f.shuffle?'active':''}" aria-pressed="${f.past&&!f.shuffle}" onclick="toggleFilter('past')">Passado</button>
    <button type="button" class="pill ${f.neg&&!f.shuffle?'active':''}" aria-pressed="${f.neg&&!f.shuffle}" onclick="toggleFilter('neg')">Negativo</button>
    <button type="button" class="pill ${f.shuffle?'active':''}" aria-pressed="${!!f.shuffle}" onclick="toggleFilter('shuffle')">🎲 Embaralhado</button>
  </div>`;
}
function setKanji(v){ if(state.showKanji!==v) toggleKanji(); }
function sheetHtml(){
  const title = {cards:'Ajustes · Cards', frases:'Ajustes · Frases', escrita:'Ajustes · Escrita'}[state.mode];
  let body = '';
  if(state.mode==='cards'){
    body += `<div class="setting"><div class="setting-label">Direção</div>${segHtml([['jp',DIR_LABEL.jp],['pt',DIR_LABEL.pt]], direction, 'setDirection')}
      <div class="setting-note">${direction==='jp' ? 'Vê o japonês e lembra o significado.' : 'Vê o português e lembra como se diz em japonês.'}</div></div>`;
  }
  if(state.mode==='cards'){
    body += `<div class="setting"><div class="setting-label">Grupo dos verbos</div>${segHtml(CARD_FILTERS, cardFilterValue(), 'setCardFilter')}</div>`;

      <button type="button" class="modal-close" onclick="closeSheet()">Pronto</button>

}

function flipCardHtml(front, back){

  </div>

}
function flipActionsHtml(noLabel, yesLabel){
  return `<div class="actions flip-actions ${state.revealed?'show':''}" id="flipActions"><button class="btn no" onclick="answerAnimated(false)">${noLabel}</button><button class="btn yes" onclick="answerAnimated(true)">${yesLabel}</button></div>`;
}
function jpFaceHtml(v){ return `${cardTag(v)}<div class="kanji">${v.kanji}</div><div class="kana">${v.kana}</div>`; }
function ptFaceHtml(v){ return `${cardTag(v)}<div class="meaning-big">${v.meaning}</div><div class="face-sub">Como se diz em japonês?</div>`; }
function answerFaceHtml(v){
  const conjOpen = state.answerConjFor===v.id;
  return `${cardTag(v)}<div class="kanji-row"><button type="button" class="kanji kanji-toggle" aria-expanded="${conjOpen}" aria-controls="answerConj" onclick="event.stopPropagation(); toggleAnswerConj(${v.id})">${v.kanji}</button>${TTS.btnHtml(v.kanji)}</div><div class="kana">${v.kana}</div><div class="answer"><div class="romaji">${v.romaji}</div><div class="meaning">${v.meaning}</div></div>${conjOpen ? `<div class="conj" id="answerConj">${conjRowsHtml(conjugate(v))}</div>` : ''}${exampleHtml(v)}`;
}

// Exemplo do verso: a frase do modo Frases com o verbo em destaque. Em
// português destaca ptPresent (ou fraseHl, quando a frase usa outra palavra).
function exampleOf(v){
  if(!v.fraseFront || !v.fraseBack) return null;
  const word = v.fraseHl || v.ptPresent || '';
  const i = word ? v.fraseBack.toLowerCase().indexOf(word.toLowerCase()) : -1;
  const pt = i===-1 ? v.fraseBack : v.fraseBack.slice(0,i) + '[' + v.fraseBack.slice(i, i+word.length) + ']' + v.fraseBack.slice(i+word.length);
  return {jp: v.fraseFront + '[' + v.kanji + ']。', kana: v.fraseFrontKana + '[' + v.kana + ']。', pt};
}
let currentAnswer = null; // answer (Cards)
let animating = false;
// Vira uma vez só: depois de ver a resposta não dá para voltar à frente.
function flipCard(){
  const card = document.getElementById('card'); if(!card || state.revealed) return;
  state.revealed = true;
  state.exampleFor = null;
  state.answerConjFor = null;
  const acts = document.getElementById('flipActions'); if(acts) acts.classList.add('show');
  const hint = document.getElementById('cardHint'); if(hint) hint.textContent = '← arraste: praticar · arraste: sabia →';
  card.classList.add('flipped');
  card.setAttribute('aria-label', 'Resposta');
  Sons.play('cards', 'virar');
}
// "Ver numa frase": abre/fecha o exemplo no verso do card.
function toggleExample(id){
  state.exampleFor = state.exampleFor===id ? null : id;
  const open = state.exampleFor===id;
  const box = document.getElementById('example'), btn = document.getElementById('exToggle');
  if(box) box.classList.toggle('open', open);
  if(btn){ btn.setAttribute('aria-expanded', open); btn.querySelector('.label').textContent = open ? 'Esconder frase' : 'Ver numa frase'; }
}
function toggleAnswerConj(id){ state.answerConjFor = state.answerConjFor===id ? null : id; render(); }
// Trecho entre [ ] vira destaque (cor accent).
function markHl(text){ return String(text||'').replace(/\[([^\]]+)\]/g, '<mark>$1</mark>'); }
function exampleHtml(v){
  const ex = exampleOf(v);
  if(!ex) return '';
  const open = state.revealed && state.exampleFor===v.id;
  const plainJp = ex.jp.replace(/[\[\]]/g, '');
  return `<button type="button" class="ex-toggle" id="exToggle" aria-expanded="${open}" aria-controls="example" onclick="toggleExample(${v.id})"><span class="label">${open ? 'Esconder frase' : 'Ver numa frase'}</span> <span class="chev" aria-hidden="true">▾</span></button>
    <div class="example ${open?'open':''}" id="example"><div><div class="example-in"><div class="fq-sentence-row"><div class="ex-jp" lang="ja">${markHl(ex.jp)}</div>${TTS.btnHtml(plainJp)}</div>${ex.kana ? `<div class="ex-kana" lang="ja">${markHl(ex.kana)}</div>` : ''}<div class="ex-pt">${markHl(ex.pt)}</div></div></div></div>`;
}
function answerAnimated(correct){
  const wrap = document.getElementById('flipWrap');
  if(animating || !state.revealed || !wrap || !currentAnswer) return;
  animating = true;
  const fn = currentAnswer;
  wrap.classList.remove('dragging'); wrap.classList.add('leaving');
  wrap.style.transform = `translateX(${correct?120:-120}%) rotate(${correct?14:-14}deg)`;
  Sons.play('cards', correct ? 'sabia' : 'praticar');
  setTimeout(()=>{ animating = false; fn(correct); }, 230);
}
// Toque vira o card; depois de virado, arrastar para a direita = Sabia,
// para a esquerda = Praticar mais (como no Quizlet/Tinder).
function setupCardGestures(){
  const card = document.getElementById('card'), wrap = document.getElementById('flipWrap');
  if(!card || !wrap) return;
  let sx = 0, dx = 0, dragging = false, moved = false;
  card.addEventListener('pointerdown', (e)=>{
    if(e.button!==0 || animating || e.target.closest('.ex-toggle') || e.target.closest('.kanji-toggle') || e.target.closest('.tts-btn') || e.target.closest('.conj-speak')) return;
    sx = e.clientX; dx = 0; dragging = true; moved = false;
    card.setPointerCapture(e.pointerId); wrap.classList.add('dragging');
  });
  card.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    dx = e.clientX - sx;
    if(Math.abs(dx) > 8) moved = true;
    const shown = state.revealed ? dx : dx * 0.2; // sem resposta à vista, só "balança"
    wrap.style.transform = `translateX(${shown}px) rotate(${shown/22}deg)`;
    wrap.dataset.swipe = state.revealed && dx > 50 ? 'right' : state.revealed && dx < -50 ? 'left' : '';
  });
  const end = ()=>{
    if(!dragging) return;
    dragging = false; wrap.classList.remove('dragging'); wrap.dataset.swipe = '';
    if(state.revealed && Math.abs(dx) > 90){ answerAnimated(dx > 0); return; }
    wrap.style.transform = '';
    if(!moved) flipCard();
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', ()=>{ dragging = false; wrap.classList.remove('dragging'); wrap.style.transform = ''; wrap.dataset.swipe = ''; });
  document.onkeydown = (e)=>{
    if(state.sheet) return;
    const tag = e.target.tagName;
    if(tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA') return;
    if(e.key===' ' || (e.key==='Enter' && tag!=='BUTTON')){ e.preventDefault(); flipCard(); return; }
    if(e.key==='1' || e.key==='ArrowLeft') answerAnimated(false);
    if(e.key==='2' || e.key==='ArrowRight') answerAnimated(true);
  };
}
function afterRender(){
  if(state.tab!=='study'){ state.sheet = false; return; }
  if(document.getElementById('flipWrap')) setupCardGestures();
  if(state.sheet){
    document.getElementById('main').insertAdjacentHTML('beforeend', sheetHtml());
    state.sheetAnim = false;
  }
}
function render(){ renderInner(); afterRender(); }

function renderInner(){
  const main = document.getElementById("main");
  document.onkeydown = null;
  document.querySelectorAll(".tab").forEach(t=>{ const active = t.dataset.tab===state.tab; t.classList.toggle("active", active); t.setAttribute("aria-selected", active); });
  document.querySelectorAll(".mode").forEach(m=>{ const active = m.dataset.mode===state.mode; m.classList.toggle("active", active); m.setAttribute("aria-selected", active); });
  document.getElementById("modes").style.display = state.tab==="study" ? "flex" : "none";
  const c = counts();

  if(state.tab==="study"){

      if(state.idx === state.reviewEnd && state.reviewWrongIds.length > 0){

        main.innerHTML = statsHtml + `<div class="empty">🔁 Revisão concluída!<br>Vamos repetir ${n === 1 ? 'a 1 que você errou' : `as ${n} que você errou`} antes de seguir.</div><button type="button" class="know-btn" onclick="continueReviews()">Continuar</button>`;
        return;
      }
      if(state.idx >= state.queue.length){
        let doneHtml;

        } else {
          const newLeft = cardPool().filter(isNew).length;
          const capLeft = newSlotsLeft();
          // Revisões além do limite de hoje e lote de novas pausado.
          const left = state.reviewsLeft || 0;
          const reviewsHtml = left > 0
            ? `<div class="empty">📚 Revisões de hoje feitas!<br>Ainda há ${left} ${left===1 ? 'revisão atrasada' : 'revisões atrasadas'}; elas ficam para os próximos dias.</div><button type="button" class="know-btn" onclick="moreReviews()">+${REVIEW_EXTRA} revisões agora</button>`
            : '';
          if(state.newPaused && newLeft > 0){
            doneHtml = (reviewsHtml || `<div class="empty">📚 Revisões de hoje feitas!</div>`)
              + `<div class="empty" style="padding-top:8px">⏸️ Palavras novas pausadas: há mais de ${NEW_PAUSE_AT} revisões pendentes. Elas voltam quando a pilha baixar.</div><button type="button" class="know-btn" onclick="forceNewDeck()">Estudar novas mesmo assim</button>`;
          } else {
            doneHtml = reviewsHtml + (newLeft>0 && capLeft>0
            ? `<div class="empty">🎉 Lote concluído!<br>Ainda há ${newLeft} verbos novos disponíveis hoje.</div><button type="button" class="know-btn" onclick="buildQueue();render();">Próximo lote (10 novas)</button>`
            : newLeft>0 && capLeft===0
            ? `<div class="empty">🎉 Rodada de hoje concluída!<br>Ainda faltam ${newLeft} verbos novos — quer mais?</div><button type="button" class="know-btn" onclick="moreNew()">+10 novas</button>`
            : `<div class="empty">🎉 Nada pendente agora.<br>Volte mais tarde ou revise as listas.</div>`);
          }
        }
        main.innerHTML = statsHtml + doneHtml; return;
      }
      const v = state.queue[state.idx];
      currentAnswer = answer;
      main.innerHTML = statsHtml
        + flipCardHtml(direction==='pt' ? ptFaceHtml(v) : jpFaceHtml(v), answerFaceHtml(v))
        + (getStatus(v)==='novo' ? `<button type="button" class="know-btn" onclick="knowIt()">✓ Já sei essa — marcar como aprendida</button>` : '')
        + flipActionsHtml('Praticar mais', 'Sabia');

    } else if(state.mode==="frases"){
      if(state.queue.length===0){ main.innerHTML = statsHtml + `<div class="empty">Nenhum verbo em "Praticando" ou "Aprendido" ainda.<br>Continue no modo Cards até o nível 2+.</div>`; return; }
      if(state.idx >= state.queue.length){ main.innerHTML = statsHtml + `<div class="empty">🎉 Fim das frases desta rodada.</div><button class="btn next" style="margin-top:12px;width:100%" onclick="buildQueue();render();">Recomeçar</button>`; return; }
      main.innerHTML = statsHtml + Frases.html(state.queue[state.idx]);
      Frases.bind(!!state.sheet);

    } else { // escrita
      if(state.queue.length===0){ main.innerHTML = statsHtml + (state.writeGroup!=='all'
        ? `<div class="empty">Nenhum verbo desse grupo em "Praticando" ou "Aprendido".<br>Troque o grupo nos Ajustes (⚙️).</div><button type="button" class="know-btn" onclick="setWriteGroup('all')">Ver todos</button>`
        : `<div class="empty">Nenhum verbo em "Praticando" ou "Aprendido" ainda.<br>Continue no modo Cards até o nível 2+.</div>`); return; }
      if(state.idx >= state.queue.length){ main.innerHTML = statsHtml + Escrita.summaryHtml(state.writeAttempts, state.writeDeckSize); return; }
      const v = state.queue[state.idx];
      const f = state.writeFilter;
      if(f.shuffle && !state.shuffledFilter) state.shuffledFilter = randomFilter();
      const eff = f.shuffle ? state.shuffledFilter : f;
      const tagsHtml = `<div class="tags">
        <span class="tagbadge ${eff.polite==='formal'?'formal':'informal'}">${eff.polite==='formal'?'Formal':'Informal'}</span>
        <span class="tagbadge time">${eff.past?'Passado':'Presente'}</span>
        <span class="tagbadge neg">${eff.neg?'Negativo':'Afirmativo'}</span>
        ${f.shuffle?'<span class="tagbadge shuffle">🎲 aleatório</span>':''}
      </div>`;
      const ptPhrase = ptForm(v, eff.past, eff.neg);
      if(!state.writeChecked){
        main.innerHTML = statsHtml + `
          <div class="card nohand">
            <div class="tag-row"><span class="group-tag">${GROUP_NAME[v.group]}</span> <span class="badge nivel-${v.nivel}">${v.nivel}</span></div>
            <div class="meaning-big">${ptPhrase}</div>
            <div class="subtle">(${v.meaning})</div>
            ${tagsHtml}
            <input class="write-input" id="writeInput" lang="ja" placeholder="digite em romaji (vira hiragana) ou kana/kanji" autocapitalize="off" autocomplete="off">
          </div>

        const inp = document.getElementById("writeInput");

        if(!state.sheet) inp.focus();
        inp.onkeydown = (ev)=>{ if(ev.key==="Enter"){ ev.stopPropagation(); checkWrite(); } };
      } else {
        main.innerHTML = statsHtml + `
          <div class="card nohand">
            <div class="tag-row"><span class="group-tag">${GROUP_NAME[v.group]}</span> <span class="badge nivel-${v.nivel}">${v.nivel}</span></div>
            <div class="meaning-big">${ptPhrase}</div>
            <div class="tags" style="margin-bottom:6px">(${v.meaning})</div>
            ${tagsHtml}
            <div class="answer">
              <div class="${state.writeOk?'result-ok':'result-no'}">${state.writeOk? '✓ Certo!' : state.writeGaveUp ? '🏳️ Desistiu: ela vai para o fim do próximo deck' : '✗ Não foi dessa vez'}</div>
              ${!state.writeOk && !state.writeGaveUp ? `<div class="write-why">Você escreveu: <b lang="ja">${(state.writeInputShown||'').replace(/[<>&]/g,'') || '—'}</b>${state.writeErr && state.writeErr.type==='forma' ? ` — essa é a forma <b>${Escrita.formLabel(state.writeErr.got)}</b>` : ''}</div>` : ''}
              <div class="kana" style="margin-top:8px;font-size:20px">${state.writeTargetKanji!==state.writeTargetKana ? state.writeTargetKanji+' · ' : ''}${state.writeTargetKana}</div>
              <div class="romaji">${state.writeTargetRomaji}</div>
              <div class="tags" style="margin-top:6px">dicionário: ${v.kanji} (${v.kana})</div>
            </div>
          </div>
          <div class="actions"><button class="btn next" onclick="writeNext(${state.writeOk})">Próxima →</button></div>`;
        document.onkeydown = (ev)=>{ if(ev.key==="Enter"){ ev.preventDefault(); writeNext(state.writeOk); } };
      }
    }
    return;
  }

  const footerHtml = `  <button type="button" class="reset" onclick="applyDefaultSeed();render();">Restaurar verbos padrão (iku, taberu, nomu = aprendido)</button>

  if(state.tab==="all"){
    const query = (state.search||'').trim();
    const needle = query.toLowerCase();
    const searched = query ? VERBS.filter(v=>
      v.kanji.includes(query) || v.kana.includes(query) ||
      v.romaji.toLowerCase().includes(needle) || v.meaning.toLowerCase().includes(needle) ||
      v.nivel.toLowerCase().includes(needle)
    ) : VERBS;
    const filtered = state.nivelFilter==='all' ? searched : searched.filter(v=>v.nivel===state.nivelFilter);

    const searchHtml = `<div class="search-row">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar por kanji, kana, romaji, nível ou significado" value="${escapeAttr(query)}">
      </div>
      <button type="button" class="info-btn" aria-label="O que são os grupos de verbos" onclick="toggleGroupInfo()">ℹ️</button>
    </div>
    <div class="pillrow">
      <button type="button" class="pill ${state.nivelFilter==='all'?'active':''}" aria-pressed="${state.nivelFilter==='all'}" onclick="setNivelFilter('all')">Todos</button>
      ${["N5","N4","N3","N2","N1"].map(n=>`<button type="button" class="pill ${state.nivelFilter===n?'active':''}" aria-pressed="${state.nivelFilter===n}" onclick="setNivelFilter('${n}')">${n}</button>`).join("")}
    </div>`;

    let listHtml = "";
    [1,2,3].forEach(g=>{
      const groupVerbs = filtered.filter(v=>v.group===g).sort(compareVerbsForDisplay);
      if(groupVerbs.length===0) return;
      const collapsed = !!state.groupCollapsed[g];
      const expanded = !!query || state.nivelFilter!=='all' || state.groupExpanded[g];
      const shown = expanded ? groupVerbs : groupVerbs.slice(0,10);
      listHtml += `<button type="button" class="group-header" onclick="toggleGroupCollapse(${g})" aria-expanded="${!collapsed}">
        <span>${GROUP_NAME[g]} <span class="subtle">(${groupVerbs.length})</span></span>

      render();
      const inp = document.getElementById("learningSearchInput");
      if(inp){ inp.focus(); try{ inp.setSelectionRange(pos,pos); }catch(e){} }
    };
  }
}

function escapeAttr(s){ return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function renderListItem(v, idx){
  const delay = Math.min(idx||0, 8) * 18;
  const s = getStatus(v);
  const badge = s==='aprendido'?'learned':(s==='praticando'?'learning':'new');
  const label = s==='aprendido'?'Aprendido':(s==='praticando'?'Praticando':'Novo');
  let conjHtml = "";
  if(state.expanded===v.id){
    conjHtml = `<div class="conj">${conjRowsHtml(conjugate(v))}</div>`;
  }
  // Precisa ser <div role="button">, não <button>: o botão 🔊 fica dentro
  // dela, e HTML não permite <button> aninhado em <button> (o navegador
  // fecharia o de fora na hora e quebraria o layout da linha).
  return `<div class="list-item" style="animation-delay:${delay}ms" role="button" tabindex="0" aria-expanded="${state.expanded===v.id}" onclick="toggleExpand(${v.id})" onkeydown="if((event.key==='Enter'||event.key===' ')&&!event.target.closest('.tts-btn')){event.preventDefault();toggleExpand(${v.id})}">
    <div class="row"><div><div class="l-kanji-row"><div class="l-kanji">${v.kanji} <span style="color:var(--sub);font-size:12px">${v.kana}</span></div>${TTS.btnHtml(v.kanji, 'tts-btn-sm')}</div><div class="l-meaning">${v.meaning}</div></div>
    <div class="badges"><span class="badge nivel-${v.nivel}">${v.nivel}</span><span class="badge g${v.group}">${GROUP_BADGE[v.group]}</span><span class="badge ${badge}">${label}</span></div></div>
    ${conjHtml}
  </div>`;
}

const NIVEL_RANK = {N5:0,N4:1,N3:2,N2:3,N1:4};
const STATUS_RANK = {aprendido:0,praticando:1,novo:2};
function compareVerbsForDisplay(a,b){
  const nd = NIVEL_RANK[a.nivel]-NIVEL_RANK[b.nivel];
  if(nd!==0) return nd;
  return STATUS_RANK[getStatus(a)]-STATUS_RANK[getStatus(b)];
}

      <p>"Godan" significa "cinco níveis" — o nome vem das cinco vogais (a, i, u, e, o) que a terminação percorre na conjugação. É o maior grupo. Terminam em う/く/ぐ/す/つ/ぬ/ぶ/む, ou em る quando a sílaba anterior tem som de "a", "u" ou "o" (ex: 走る hashiru, 売る uru). A raiz muda a cada conjugação (話す → 話さない → 話します → 話した).</p>

// Mantém a barra de ações (.actions, position:fixed) acima do teclado virtual.
// No Chrome/Android o interactive-widget=resizes-content do viewport já resolve
// (aqui o offset fica 0); no iOS o teclado só encolhe o visualViewport, então
// medimos a diferença e subimos a barra por essa altura.
if(window.visualViewport){
  const updateKb = ()=>{
    const vv = window.visualViewport;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', kb + 'px');
  };
  visualViewport.addEventListener('resize', updateKb);
  visualViewport.addEventListener('scroll', updateKb);

  // Teclado abriu com o campo de resposta em foco (Escrita / Frases): rola a
  // página até o fim para o campo e os botões ficarem acima do teclado.
  const writing = ()=>{ const a = document.activeElement; return !!a && !!a.closest && !!a.closest('.write-input'); };
  const toBottom = ()=>{ if(writing()) window.scrollTo({top: document.documentElement.scrollHeight, behavior: 'smooth'}); };
  let lastH = visualViewport.height;
  visualViewport.addEventListener('resize', ()=>{
    const h = visualViewport.height;
    if(h < lastH - 80) setTimeout(toBottom, 60); // encolheu = teclado abriu
    lastH = h;
  });
  document.addEventListener('focusin', (e)=>{ if(e.target.closest && e.target.closest('.write-input')) setTimeout(toBottom, 350); });
}

buildQueue();
render();
TTS.onReady(render); // vozes carregam depois: refaz o render pro botão 🔊 aparecer

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("../sw.js").catch(()=>{}); });
}
