<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>動詞 SRS — Verbos Japoneses</title>
<meta name="theme-color" content="#c0392b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="動詞 SRS">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f7f5f2; --card:#ffffff; --text:#1c1c1c; --sub:#6b6b6b;
  --accent:#c0392b; --accent2:#2c7a4b; --border:#e3ddd3; --chip:#efe9e0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#161513; --card:#221f1c; --text:#f0ece5; --sub:#a89f92; --accent:#e0574a; --accent2:#4caf7d; --border:#3a352f; --chip:#2c2823; } }
:root[data-theme="dark"]{ --bg:#161513; --card:#221f1c; --text:#f0ece5; --sub:#a89f92; --accent:#e0574a; --accent2:#4caf7d; --border:#3a352f; --chip:#2c2823; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans",sans-serif;display:flex;flex-direction:column;min-height:100%}
button{font:inherit;color:inherit;background:none;border:none;-webkit-appearance:none;appearance:none;cursor:pointer}
header{position:relative;padding:14px 16px calc(10px + env(safe-area-inset-top,0px));text-align:center;border-bottom:1px solid var(--border)}
h1{font-size:17px;margin:0}
.theme-btn{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));font-size:16px;padding:4px 8px;border-radius:8px}
.theme-btn:hover{background:var(--chip)}
.tabs{display:flex;gap:6px;padding:30px 12px;overflow-x:auto;    min-height: 100px;}
.tab{flex:1;text-align:center;padding:8px 6px;border-radius:10px;background:var(--chip);color:var(--sub);font-size:13px;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff}
.modes{display:flex;gap:6px;padding:0 16px 8px;max-width:480px;margin:0 auto;width:100%}
.mode{flex:1;text-align:center;padding:7px 4px;border-radius:20px;border:1px solid var(--border);color:var(--sub);font-size:12px}
.mode.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
main{flex:1;padding:8px 16px 24px;max-width:480px;margin:0 auto;width:100%}
.stats{display:flex;justify-content:space-around;margin:6px 0 16px;font-size:12px;color:var(--sub)}
.stats b{color:var(--text);font-size:16px;display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 20px;text-align:center;min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer}
.card.nohand{cursor:default}
button.card{
  margin: 0 auto;
      justify-self: center;
    width: 100%;
}
.group-tag{display:inline-block;font-size:11px;color:var(--sub);background:var(--chip);padding:2px 8px;border-radius:20px;margin:0 auto 6px}
.kanji{font-size:34px;font-weight:600}
.kana{font-size:16px;color:var(--sub)}
.sentence{font-size:24px;font-weight:600;line-height:1.4}
.meaning-big{font-size:24px;font-weight:600}
.answer{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.romaji{font-size:15px;color:var(--sub)}
.meaning{font-size:19px;font-weight:600;margin-top:4px}
.hint{font-size:12px;color:var(--sub);margin-top:14px}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:14px 0;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.btn.no{background:#f5d6d2;color:#8a2c20}
.btn.yes{background:#d3ecdc;color:#1f5c38}
.btn.next{background:var(--chip);color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.no{background:#4a2621;color:#f5b8ae} :root:not([data-theme="light"]) .btn.yes{background:#20402c;color:#9fe0b8}}
:root[data-theme="dark"] .btn.no{background:#4a2621;color:#f5b8ae}
:root[data-theme="dark"] .btn.yes{background:#20402c;color:#9fe0b8}
.write-input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;margin-top:14px;text-align:center}
.search-row{display:flex;gap:8px;align-items:center;margin:4px 0 14px}
.search-input{flex:1;width:auto;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;text-align:left}
.info-btn{flex-shrink:0;width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:18px;display:flex;align-items:center;justify-content:center}
.info-btn:hover{background:var(--chip)}
.group-header{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin:18px 4px 6px}
.group-header:first-of-type{margin-top:4px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--card);border-radius:16px;padding:20px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;text-align:left}
.modal h2{margin:0 0 14px;font-size:16px}
.modal h3{margin:16px 0 4px;font-size:14px}
.modal h3:first-of-type{margin-top:0}
.modal p{margin:2px 0;font-size:13px;color:var(--sub);line-height:1.6}
.modal-close{display:block;width:100%;margin-top:18px;padding:12px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:14px}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.pill{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--chip);color:var(--sub);font-size:12px;cursor:pointer}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tags{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.tagbadge{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--sub);transition:.15s}
.tagbadge.formal{background:#e7def7;color:#6b3aa8}
.tagbadge.informal{background:#dceee4;color:#28724a}
.tagbadge.time{background:#dceaf7;color:#2f6094}
.tagbadge.neg{background:#f6dfd9;color:#a04432}
.tagbadge.shuffle{background:#eee0b8;color:#80620b}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tagbadge.formal{background:#342647;color:#d0a9f0}
  :root:not([data-theme="light"]) .tagbadge.informal{background:#203c2c;color:#9fdfb8}
  :root:not([data-theme="light"]) .tagbadge.time{background:#213449;color:#9fc4e8}
  :root:not([data-theme="light"]) .tagbadge.neg{background:#432923;color:#efaaa0}
  :root:not([data-theme="light"]) .tagbadge.shuffle{background:#40371f;color:#e8cf7e}
}
:root[data-theme="dark"] .tagbadge.formal{background:#342647;color:#d0a9f0}
:root[data-theme="dark"] .tagbadge.informal{background:#203c2c;color:#9fdfb8}
:root[data-theme="dark"] .tagbadge.time{background:#213449;color:#9fc4e8}
:root[data-theme="dark"] .tagbadge.neg{background:#432923;color:#efaaa0}
:root[data-theme="dark"] .tagbadge.shuffle{background:#40371f;color:#e8cf7e}
.subtle{font-size:11px;color:var(--sub);margin-top:2px;margin-bottom:6px}
.result-ok{color:#1f5c38;font-weight:700}
.result-no{color:#8a2c20;font-weight:700}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.list-item{display:block;width:100%;text-align:left;padding:12px 10px;border-bottom:1px solid var(--border);font-size:14px}
.list-item .row{display:flex;justify-content:space-between;align-items:center}
.list-item .l-kanji{font-size:17px}
.list-item .l-meaning{color:var(--sub);font-size:12px}
.badges{display:flex;gap:6px;align-items:center}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge.g1{background:#e4ecf7;color:#2a5599}
.badge.g2{background:#f7e9e4;color:#a05a2a}
.badge.g3{background:#eee0f7;color:#7a2ea0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.g1{background:#1f2c40;color:#9ab8ea} :root:not([data-theme="light"]) .badge.g2{background:#3a2a20;color:#e8b48c} :root:not([data-theme="light"]) .badge.g3{background:#332040;color:#d3a8ea}}
.badge.new{background:var(--chip);color:var(--sub)}
.badge.learning{background:#fdf0d5;color:#a06b0a}
.badge.learned{background:#d3ecdc;color:#1f5c38}
.conj{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:13px}
.conj-row{display:flex;justify-content:space-between;padding:4px 0}
.conj-row .lbl{color:var(--sub)}
.reset{display:block;margin:20px auto 0;font-size:12px;color:var(--sub);background:none;border:none;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<header>
  <button type="button" class="theme-btn" id="themeBtn" aria-label="Alternar tema"></button>
  <h1>動詞 SRS 🇯🇵 Verbos Japoneses</h1>
</header>
<div class="tabs" role="tablist">
  <button type="button" class="tab active" role="tab" aria-selected="true" data-tab="study">Estudar</button>
  <button type="button" class="tab" role="tab" aria-selected="false" data-tab="all">Todos</button>
  <button type="button" class="tab" role="tab" aria-selected="false" data-tab="learning">Praticando</button>
  <button type="button" class="tab" role="tab" aria-selected="false" data-tab="learned">Aprendidos</button>
</div>
<div class="modes" id="modes" style="display:none" role="tablist">
  <button type="button" class="mode active" role="tab" aria-selected="true" data-mode="cards">Cards</button>
  <button type="button" class="mode" role="tab" aria-selected="false" data-mode="escrita">Escrita</button>
  <button type="button" class="mode" role="tab" aria-selected="false" data-mode="frases">Frases</button>
</div>
<main id="main"></main>

const KEY = "jpverbs-progress-v2";

function loadProgress(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function saveProgress(p){ try{ localStorage.setItem(KEY, JSON.stringify(p)); }catch(e){} }

const THEME_KEY = "jpverbs-theme";
function loadTheme(){ try{ return localStorage.getItem(THEME_KEY) || 'auto'; }catch(e){ return 'auto'; } }
function applyTheme(mode){
  if(mode==='light') document.documentElement.setAttribute('data-theme','light');
  else if(mode==='dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  const btn = document.getElementById('themeBtn');
  if(btn){ btn.textContent = mode==='light' ? '☀️' : mode==='dark' ? '🌙' : '🌓'; btn.title = 'Tema: ' + (mode==='light'?'claro':mode==='dark'?'escuro':'automático'); }
}
let themeMode = loadTheme();
applyTheme(themeMode);
function toggleTheme(){
  themeMode = themeMode==='auto' ? 'light' : themeMode==='light' ? 'dark' : 'auto';
  try{ localStorage.setItem(THEME_KEY, themeMode); }catch(e){}
  applyTheme(themeMode);
}

const KANJI_KEY = "jpverbs-frase-kanji";

function saveKanjiPref(v){ try{ localStorage.setItem(KANJI_KEY, v ? '1' : '0'); }catch(e){} }

function applyDefaultSeed(){
  const APRENDIDO_ROMAJI = ["iku","taberu","nomu"];
  const PRATICANDO_ROMAJI = ["yomu","kuru","kaeru"];
  VERBS.forEach(v=>{
    if(APRENDIDO_ROMAJI.includes(v.romaji)){
      progress[v.id] = {level:4, fraseHits:2, due: today()+14};
    } else if(PRATICANDO_ROMAJI.includes(v.romaji)){
      progress[v.id] = {level:2, fraseHits:0, due: today()+3};
    }
  });
  saveProgress(progress);
}
const SEED_FLAG = "jpverbs-seeded-v3";
if(!localStorage.getItem(SEED_FLAG)){
  applyDefaultSeed();
  localStorage.setItem(SEED_FLAG, "1");
}
function getEntry(id){ if(!progress[id]) progress[id] = {level:0, due:0, fraseHits:0}; if(progress[id].fraseHits===undefined) progress[id].fraseHits=0; return progress[id]; }
function today(){ return Math.floor(Date.now()/86400000); }
function getStatus(v){
  const e = progress[v.id];
  if(!e || e.level<2) return 'novo';
  if(e.level<4 || e.fraseHits<2) return 'praticando';
  return 'aprendido';
}

const GODAN_MAP = {
 'う':{nai:'わ',i:'い',te:'って',ta:'った'}, 'く':{nai:'か',i:'き',te:'いて',ta:'いた'},
 'ぐ':{nai:'が',i:'ぎ',te:'いで',ta:'いだ'}, 'す':{nai:'さ',i:'し',te:'して',ta:'した'},
 'つ':{nai:'た',i:'ち',te:'って',ta:'った'}, 'ぬ':{nai:'な',i:'に',te:'んで',ta:'んだ'},
 'ぶ':{nai:'ば',i:'び',te:'んで',ta:'んだ'}, 'む':{nai:'ま',i:'み',te:'んで',ta:'んだ'},
 'る':{nai:'ら',i:'り',te:'って',ta:'った'}
};
function conjugate(v){
  const k = v.kana;
  if(v.group===1){
    const stem = k.slice(0,-1), last = k.slice(-1), m = GODAN_MAP[last];
    const isIku = k==="いく";
    const ta = isIku ? "った" : m.ta;
    const te = isIku ? "って" : m.te;
    return { dict:k, masu:stem+m.i+"ます", nai:stem+m.nai+"ない", masen:stem+m.i+"ません",
      te:stem+te, ta:stem+ta, mashita:stem+m.i+"ました", nakatta:stem+m.nai+"なかった", masendeshita:stem+m.i+"ませんでした" };
  }
  if(v.group===2){
    const stem = k.slice(0,-1);
    return { dict:k, masu:stem+"ます", nai:stem+"ない", masen:stem+"ません",
      te:stem+"て", ta:stem+"た", mashita:stem+"ました", nakatta:stem+"なかった", masendeshita:stem+"ませんでした" };
  }
  if(k==="くる"){
    return { dict:"くる", masu:"きます", nai:"こない", masen:"きません",
      te:"きて", ta:"きた", mashita:"きました", nakatta:"こなかった", masendeshita:"きませんでした" };
  }
  const prefix = k.slice(0,-2);
  return { dict:prefix+"する", masu:prefix+"します", nai:prefix+"しない", masen:prefix+"しません",
    te:prefix+"して", ta:prefix+"した", mashita:prefix+"しました", nakatta:prefix+"しなかった", masendeshita:prefix+"しませんでした" };
}

function sentenceFor(v, showKanji){
  return showKanji
    ? { front: v.fraseFront+v.kanji+"。", back: v.fraseBack }
    : { front: v.fraseFrontKana+v.kana+"。", back: v.fraseBack };
}

function ptForm(v, past, neg){
  const base = past ? v.ptPast : v.ptPresent;
  if(!neg) return base;
  if(base.includes('-me')) return 'não me ' + base.replace('-me','');
  return 'não ' + base;
}

const H = {'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
'や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'wo','ん':'n'};
const YOON = {'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho','ちゃ':'cha','ちゅ':'chu','ちょ':'cho',
'にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo',
'りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo','じゃ':'ja','じゅ':'ju','じょ':'jo',
'びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo'};
function kanaToRomaji(str){
  let out='', i=0;
  while(i<str.length){
    const c=str[i], next=str[i+1], combo=c+(next||'');
    if(c==='っ'){
      const nextCombo = next+(str[i+2]||'');
      const nr = YOON[nextCombo] || H[next] || '';
      if(nr) out += nr[0];
      i++; continue;
    }
    if(YOON[combo]){ out+=YOON[combo]; i+=2; continue; }
    out += H[c] || c; i++;
  }
  return out;
}

function normRomaji(s){ return s.toLowerCase().trim().replace(/\s+/g,""); }

let state = {tab:"study", mode:"cards", queue:[], idx:0, revealed:false, expanded:null, writeChecked:false, writeOk:false, testMode:false,
  writeFilter:{polite:'informal', past:false, neg:false, shuffle:false}, shuffledFilter:null,
  search:'', groupExpanded:{1:false,2:false,3:false}, showGroupInfo:false,
  showKanji: loadKanjiPref(), cardGroupFilter:'all'};

function targetKey(f){
  if(f.polite==='informal'){
    if(!f.past && !f.neg) return 'dict';
    if(!f.past && f.neg) return 'nai';
    if(f.past && !f.neg) return 'ta';
    return 'nakatta';
  }
  if(!f.past && !f.neg) return 'masu';
  if(!f.past && f.neg) return 'masen';
  if(f.past && !f.neg) return 'mashita';
  return 'masendeshita';
}
function randomFilter(){
  return { polite: Math.random()<0.5?'informal':'formal', past: Math.random()<0.5, neg: Math.random()<0.5 };
}
function toggleFilter(kind){
  const f = state.writeFilter;

  if(kind==='formal'){
    f.polite = 'formal';
    f.shuffle = false;
    state.shuffledFilter = null;
  } else if(kind==='informal'){
    f.polite = 'informal';
    f.shuffle = false;
    state.shuffledFilter = null;
  } else if(kind==='past'){
    f.past = !f.past;
    f.shuffle = false;
    state.shuffledFilter = null;
  } else if(kind==='neg'){
    f.neg = !f.neg;
    f.shuffle = false;
    state.shuffledFilter = null;
  } else if(kind==='shuffle'){
    f.shuffle = !f.shuffle;
    state.shuffledFilter = f.shuffle ? randomFilter() : null;
  }

  render();
}

function buildQueue(){
  const t = today();
  if(state.mode==="cards"){
    const pool = state.cardGroupFilter==='all' ? VERBS : VERBS.filter(v=>v.group===state.cardGroupFilter);
    state.queue = pool.filter(v=> getEntry(v.id).due <= t).sort((a,b)=> getEntry(a.id).due - getEntry(b.id).due);
  } else {
    state.queue = VERBS.filter(v=>{ const e=progress[v.id]; return e && e.level>=2; }).sort(()=>Math.random()-0.5);
  }
  state.idx = 0; state.revealed = false; state.writeChecked=false;
}
function setCardGroupFilter(g){ state.cardGroupFilter = g; buildQueue(); render(); }

function answer(correct){
  const v = state.queue[state.idx]; const e = getEntry(v.id);
  e.level = correct ? Math.min(e.level+1, INTERVALS.length-1) : 0;
  e.due = state.testMode ? today() : today() + INTERVALS[e.level];
  saveProgress(progress); state.idx++; state.revealed = false;
  if(state.testMode) state.queue.push(v);
  render();
}
function toggleTestMode(){ state.testMode = !state.testMode; render(); }
function fraseAnswer(correct){
  const v = state.queue[state.idx]; const e = getEntry(v.id);
  if(correct){
    e.fraseHits = Math.min(e.fraseHits+1, 2);
  } else {
    e.fraseHits = Math.max(e.fraseHits-1, 0);
    // Igual à escrita: nunca derruba o nível a ponto de "desaprender" o verbo.
    e.level = Math.max(e.level-1, 2);
  }
  saveProgress(progress); state.idx++; state.revealed = false; render();
}
function checkWrite(){
  const v = state.queue[state.idx];
  const input = document.getElementById("writeInput").value;
  const eff = state.writeFilter.shuffle ? state.shuffledFilter : state.writeFilter;
  const key = targetKey(eff);
  const targetKana = conjugate(v)[key];
  const targetRomaji = kanaToRomaji(targetKana);
  state.writeOk = normRomaji(input) === normRomaji(targetRomaji);
  state.writeTargetKana = targetKana;
  state.writeTargetRomaji = targetRomaji;
  state.writeChecked = true; render();
}
function writeNext(correct){
  const v = state.queue[state.idx]; const e = getEntry(v.id);
  if(correct){
    e.level = Math.min(e.level+1, INTERVALS.length-1);
    e.due = today() + INTERVALS[e.level];
  } else {
    // Escrita é prática extra: erro não zera o nível (senão o verbo cairia de "Praticando/Aprendido"
    // direto pra "Novo" e sumiria do próprio pool de Escrita, que exige nível >= 2).
    e.level = Math.max(e.level-1, 2);
  }
  saveProgress(progress);
  state.idx++;
  state.writeChecked=false;
  state.shuffledFilter = state.writeFilter.shuffle ? randomFilter() : null;
  render();
}

function counts(){
  let novo=0, praticando=0, aprendido=0;
  VERBS.forEach(v=>{ const s = getStatus(v); if(s==='novo') novo++; else if(s==='praticando') praticando++; else aprendido++; });
  return {novo, praticando, aprendido};
}

function render(){
  const main = document.getElementById("main");
  document.onkeydown = null;
  document.querySelectorAll(".tab").forEach(t=>{ const active = t.dataset.tab===state.tab; t.classList.toggle("active", active); t.setAttribute("aria-selected", active); });
  document.querySelectorAll(".mode").forEach(m=>{ const active = m.dataset.mode===state.mode; m.classList.toggle("active", active); m.setAttribute("aria-selected", active); });
  document.getElementById("modes").style.display = state.tab==="study" ? "flex" : "none";
  const c = counts();

  if(state.tab==="study"){
    const statsHtml = `<div class="stats"><div><b>${c.novo}</b>Novos</div><div><b>${c.praticando}</b>Praticando</div><div><b>${c.aprendido}</b>Aprendidos</div><div><b>${state.queue.length-state.idx}</b>Na fila</div></div>`;
    const testToggleHtml = state.mode==="cards" ? `<button class="reset" style="margin:0 0 10px" onclick="toggleTestMode()">${state.testMode?'🧪 Modo teste: ON (toque pra desligar)':'Ativar modo teste (intervalos = 0)'}</button>` : '';

    if(state.mode==="cards"){
      const groupFilterHtml = `<div class="pillrow">
        <button type="button" class="pill ${state.cardGroupFilter==='all'?'active':''}" aria-pressed="${state.cardGroupFilter==='all'}" onclick="setCardGroupFilter('all')">Todos</button>
        <button type="button" class="pill ${state.cardGroupFilter===1?'active':''}" aria-pressed="${state.cardGroupFilter===1}" onclick="setCardGroupFilter(1)">Grupo 1</button>
        <button type="button" class="pill ${state.cardGroupFilter===2?'active':''}" aria-pressed="${state.cardGroupFilter===2}" onclick="setCardGroupFilter(2)">Grupo 2</button>
        <button type="button" class="pill ${state.cardGroupFilter===3?'active':''}" aria-pressed="${state.cardGroupFilter===3}" onclick="setCardGroupFilter(3)">Grupo 3</button>
      </div>`;
      if(state.idx >= state.queue.length){ main.innerHTML = statsHtml + testToggleHtml + groupFilterHtml + `<div class="empty">🎉 Nada pendente agora.<br>Volte mais tarde ou revise as listas.</div>`; return; }
      const v = state.queue[state.idx];
      const cardTag = state.revealed ? 'div' : 'button';
      const cardAttrs = state.revealed ? 'class="card nohand" id="card"' : 'type="button" class="card" id="card"';
      main.innerHTML = statsHtml + testToggleHtml + groupFilterHtml + `
        <${cardTag} ${cardAttrs}>
          <span class="group-tag">${GROUP_NAME[v.group]}</span>
          <div class="kanji">${v.kanji}</div><div class="kana">${v.kana}</div>
          ${state.revealed ? `<div class="answer"><div class="romaji">${v.romaji}</div><div class="meaning">${v.meaning}</div></div>` : `<div class="hint">Toque para ver a resposta</div>`}
        </${cardTag}>
        ${state.revealed ? `<div class="actions"><button class="btn no" onclick="answer(false)">Não sabia</button><button class="btn yes" onclick="answer(true)">Sabia ✓</button></div>` : ``}`;
      if(!state.revealed) document.getElementById("card").onclick = ()=>{ state.revealed=true; render(); };

    } else if(state.mode==="frases"){
      const kanjiToggleHtml = `<div class="pillrow">
        <button type="button" class="pill ${state.showKanji?'active':''}" aria-pressed="${state.showKanji}" onclick="toggleKanji()">${state.showKanji ? '🈶 Kanji' : 'あ Hiragana'}</button>
      </div>`;
      if(state.queue.length===0){ main.innerHTML = statsHtml + kanjiToggleHtml + `<div class="empty">Nenhum verbo em "Praticando" ou "Aprendido" ainda.<br>Continue no modo Cards até o nível 2+.</div>`; return; }
      if(state.idx >= state.queue.length){ main.innerHTML = statsHtml + kanjiToggleHtml + `<div class="empty">🎉 Fim das frases desta rodada.</div><button class="btn next" style="margin-top:12px" onclick="buildQueue();render();">Recomeçar</button>`; return; }
      const v = state.queue[state.idx]; const s = sentenceFor(v, state.showKanji);
      const cardTag2 = state.revealed ? 'div' : 'button';
      const cardAttrs2 = state.revealed ? 'class="card nohand" id="card"' : 'type="button" class="card" id="card"';
      main.innerHTML = statsHtml + kanjiToggleHtml + `
        <${cardTag2} ${cardAttrs2}>
          <span class="group-tag">${state.showKanji ? v.kanji : v.kana} · ${GROUP_NAME[v.group]}</span>
          <div class="sentence">${s.front}</div>
          ${state.revealed ? `<div class="answer"><div class="meaning">${s.back}</div></div>` : `<div class="hint">Toque para ver a tradução</div>`}
        </${cardTag2}>
        ${state.revealed ? `<div class="actions"><button class="btn no" onclick="fraseAnswer(false)">Não lembrei</button><button class="btn yes" onclick="fraseAnswer(true)">Lembrei ✓</button></div>` : ``}`;
      if(!state.revealed) document.getElementById("card").onclick = ()=>{ state.revealed=true; render(); };

    } else { // escrita
      if(state.queue.length===0){ main.innerHTML = statsHtml + `<div class="empty">Nenhum verbo em "Praticando" ou "Aprendido" ainda.<br>Continue no modo Cards até o nível 2+.</div>`; return; }
      if(state.idx >= state.queue.length){ main.innerHTML = statsHtml + `<div class="empty">🎉 Fim da rodada de escrita.</div><div class="actions" style="margin-top:12px"><button class="btn yes" onclick="buildQueue();render();">🔁 Praticar de novo</button></div>`; return; }
      const v = state.queue[state.idx];
      const f = state.writeFilter;
      const pillsHtml = `<div class="pillrow">
        <button type="button" class="pill ${f.polite==='informal'&&!f.shuffle?'active':''}" aria-pressed="${f.polite==='informal'&&!f.shuffle}" onclick="toggleFilter('informal')">Informal</button>
        <button type="button" class="pill ${f.polite==='formal'&&!f.shuffle?'active':''}" aria-pressed="${f.polite==='formal'&&!f.shuffle}" onclick="toggleFilter('formal')">Formal</button>
        <button type="button" class="pill ${f.past&&!f.shuffle?'active':''}" aria-pressed="${f.past&&!f.shuffle}" onclick="toggleFilter('past')">Passado</button>
        <button type="button" class="pill ${f.neg&&!f.shuffle?'active':''}" aria-pressed="${f.neg&&!f.shuffle}" onclick="toggleFilter('neg')">Negativo</button>
        <button type="button" class="pill ${f.shuffle?'active':''}" aria-pressed="${!!f.shuffle}" onclick="toggleFilter('shuffle')">🎲 Embaralhado</button>
      </div>`;
      if(f.shuffle && !state.shuffledFilter) state.shuffledFilter = randomFilter();
      const eff = f.shuffle ? state.shuffledFilter : f;
      const tagsHtml = `<div class="tags">
        <span class="tagbadge ${eff.polite==='formal'?'formal':'informal'}">${eff.polite==='formal'?'Formal':'Informal'}</span>
        <span class="tagbadge time">${eff.past?'Passado':'Presente'}</span>
        <span class="tagbadge neg">${eff.neg?'Negativo':'Afirmativo'}</span>
        ${f.shuffle?'<span class="tagbadge shuffle">🎲 aleatório</span>':''}
      </div>`;
      const ptPhrase = ptForm(v, eff.past, eff.neg);
      if(!state.writeChecked){
        main.innerHTML = statsHtml + pillsHtml + `
          <div class="card nohand">
            <span class="group-tag">${GROUP_NAME[v.group]}</span>
            <div class="meaning-big">${ptPhrase}</div>
            <div class="subtle">(${v.meaning})</div>
            ${tagsHtml}
            <input class="write-input" id="writeInput" placeholder="escreva em romaji" autocapitalize="off" autocomplete="off">
          </div>
          <div class="actions"><button class="btn yes" onclick="checkWrite()">Conferir</button></div>`;
        const inp = document.getElementById("writeInput");
        inp.focus();
        inp.onkeydown = (ev)=>{ if(ev.key==="Enter"){ ev.stopPropagation(); checkWrite(); } };
      } else {
        main.innerHTML = statsHtml + pillsHtml + `
          <div class="card nohand">
            <span class="group-tag">${GROUP_NAME[v.group]}</span>
            <div class="meaning-big">${ptPhrase}</div>
            <div class="tags" style="margin-bottom:6px">(${v.meaning})</div>
            ${tagsHtml}
            <div class="answer">
              <div class="${state.writeOk?'result-ok':'result-no'}">${state.writeOk? '✓ Certo!' : '✗ Não foi dessa vez'}</div>
              <div class="kana" style="margin-top:8px;font-size:20px">${state.writeTargetKana}</div>
              <div class="romaji">${state.writeTargetRomaji}</div>
              <div class="tags" style="margin-top:6px">dicionário: ${v.kanji} (${v.kana})</div>
            </div>
          </div>
          <div class="actions"><button class="btn next" onclick="writeNext(${state.writeOk})">Próxima →</button></div>`;
        document.onkeydown = (ev)=>{ if(ev.key==="Enter"){ ev.preventDefault(); writeNext(state.writeOk); } };
      }
    }
    return;
  }

  const footerHtml = `<div class="pillrow" style="margin-top:16px">
    <button type="button" class="reset" onclick="exportProgress()">⬇ Exportar progresso</button>
    <button type="button" class="reset" onclick="document.getElementById('importFile').click()">⬆ Importar progresso</button>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importProgress(this.files[0])">
  <button type="button" class="reset" onclick="applyDefaultSeed();render();">Restaurar verbos padrão (iku, taberu, nomu = aprendido)</button>
  <button type="button" class="reset" onclick="resetProgress()">Zerar todo o progresso</button>`;

  if(state.tab==="all"){
    const query = (state.search||'').trim();
    const needle = query.toLowerCase();
    const filtered = query ? VERBS.filter(v=>
      v.kanji.includes(query) || v.kana.includes(query) ||
      v.romaji.toLowerCase().includes(needle) || v.meaning.toLowerCase().includes(needle)
    ) : VERBS;

    const searchHtml = `<div class="search-row">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar por kanji, kana, romaji ou significado" value="${escapeAttr(query)}">
      <button type="button" class="info-btn" aria-label="O que são os grupos de verbos" onclick="toggleGroupInfo()">ℹ️</button>
    </div>`;

    let listHtml = "";
    [1,2,3].forEach(g=>{
      const groupVerbs = filtered.filter(v=>v.group===g);
      if(groupVerbs.length===0) return;
      const expanded = !!query || state.groupExpanded[g];
      const shown = expanded ? groupVerbs : groupVerbs.slice(0,10);
      listHtml += `<div class="group-header">${GROUP_NAME[g]} <span class="subtle">(${groupVerbs.length})</span></div>`;
      listHtml += shown.map(renderListItem).join("");
      if(!expanded && groupVerbs.length>10){
        listHtml += `<button type="button" class="reset" onclick="expandGroup(${g})">Ver mais (+${groupVerbs.length-10})</button>`;
      }
    });
    if(filtered.length===0) listHtml = `<div class="empty">Nenhum verbo encontrado.</div>`;

    main.innerHTML = searchHtml + listHtml + footerHtml + groupInfoModal();

    const searchInp = document.getElementById("searchInput");
    searchInp.oninput = function(){
      const pos = this.selectionStart;
      state.search = this.value;
      render();
      const inp = document.getElementById("searchInput");
      if(inp){ inp.focus(); try{ inp.setSelectionRange(pos,pos); }catch(e){} }
    };
    return;
  }

  const list = state.tab==="learning" ? VERBS.filter(v=>getStatus(v)==='praticando') : VERBS.filter(v=>getStatus(v)==='aprendido');
  if(list.length===0){ main.innerHTML = `<div class="empty">Nada aqui ainda.</div>`; return; }
  main.innerHTML = list.map(renderListItem).join("") + footerHtml;
}

function escapeAttr(s){ return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function renderListItem(v){
  const s = getStatus(v);
  const badge = s==='aprendido'?'learned':(s==='praticando'?'learning':'new');
  const label = s==='aprendido'?'Aprendido':(s==='praticando'?'Praticando':'Novo');
  let conjHtml = "";
  if(state.expanded===v.id){
    const c = conjugate(v);
    conjHtml = `<div class="conj">
      <div class="conj-row"><span class="lbl">Informal (dic.)</span><span>${c.dict}</span></div>
      <div class="conj-row"><span class="lbl">Formal</span><span>${c.masu}</span></div>
      <div class="conj-row"><span class="lbl">Forma Te</span><span>${c.te}</span></div>
      <div class="conj-row"><span class="lbl">Negativo informal</span><span>${c.nai}</span></div>
      <div class="conj-row"><span class="lbl">Negativo formal</span><span>${c.masen}</span></div>
      <div class="conj-row"><span class="lbl">Passado informal</span><span>${c.ta}</span></div>
      <div class="conj-row"><span class="lbl">Passado formal</span><span>${c.mashita}</span></div>
      <div class="conj-row"><span class="lbl">Passado neg. informal</span><span>${c.nakatta}</span></div>
      <div class="conj-row"><span class="lbl">Passado neg. formal</span><span>${c.masendeshita}</span></div>
    </div>`;
  }
  return `<button type="button" class="list-item" aria-expanded="${state.expanded===v.id}" onclick="toggleExpand(${v.id})">
    <div class="row"><div><div class="l-kanji">${v.kanji} <span style="color:var(--sub);font-size:12px">${v.kana}</span></div><div class="l-meaning">${v.meaning}</div></div>
    <div class="badges"><span class="badge g${v.group}">${GROUP_BADGE[v.group]}</span><span class="badge ${badge}">${label}</span></div></div>
    ${conjHtml}
  </button>`;
}

function expandGroup(g){ state.groupExpanded[g] = true; render(); }

function toggleGroupInfo(){ state.showGroupInfo = !state.showGroupInfo; render(); }
function groupInfoModal(){
  if(!state.showGroupInfo) return "";
  return `<div class="modal-backdrop" onclick="if(event.target===this) toggleGroupInfo()">
    <div class="modal">
      <h2>Grupos de verbos japoneses</h2>
      <h3>Grupo 1 · Godan (五段動詞)</h3>
      <p>"Godan" significa "cinco níveis" — o nome vem das cinco vogais (a, i, u, e, o) que a terminação percorre na conjugação. É o maior grupo. Terminam em う/く/ぐ/す/つ/ぬ/ぶ/む, ou em る quando a sílaba anterior tem som de "a", "u" ou "o" (ex: 走る hashiru, 売る uru). A raiz muda a cada conjugação (話す → 話さない → 話します → 話した).</p>
      <h3>Grupo 2 · Ichidan (一段動詞)</h3>
      <p>"Ichidan" significa "um nível" — a raiz não muda, só se troca o る final. Terminam em る, com a sílaba anterior tendo som de "i" ou "e" (ex: 食べる taberu, 見る miru). Conjugação simples: remove o る e adiciona a terminação (食べ+ます, 食べ+ない).</p>
      <h3>Grupo 3 · Irregular (不規則動詞)</h3>
      <p>Só dois verbos de verdade: する (suru, "fazer") e 来る (kuru, "vir") — além dos compostos com する (勉強する, 電話する etc). Não seguem padrão nenhum e são decorados individualmente (する → します/しない/した; 来る → 来ます/来ない/来た, com a leitura mudando de くる pra き/こ conforme a forma).</p>
      <button type="button" class="modal-close" onclick="toggleGroupInfo()">Entendi</button>
    </div>
  </div>`;
}

function toggleExpand(id){ state.expanded = (state.expanded===id) ? null : id; render(); }
function resetProgress(){ if(confirm("Zerar todo o progresso salvo?")){ progress = {}; saveProgress(progress); buildQueue(); render(); } }

function exportProgress(){
  try{
    const data = JSON.stringify(progress, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'jpverbs-progresso.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ alert('Não foi possível exportar o progresso.'); }
}
function importProgress(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(typeof data !== 'object' || data===null || Array.isArray(data)) throw new Error('formato inválido');
      progress = data;
      saveProgress(progress);
      buildQueue();
      render();
      alert('Progresso importado com sucesso!');
    }catch(e){ alert('Arquivo inválido.'); }
  };
  reader.readAsText(file);
}

document.getElementById("themeBtn").onclick = toggleTheme;
document.querySelectorAll(".tab").forEach(t=>{ t.onclick = ()=>{ state.tab = t.dataset.tab; state.expanded=null; if(state.tab==="study") buildQueue(); render(); }; });
document.querySelectorAll(".mode").forEach(m=>{ m.onclick = ()=>{ state.mode = m.dataset.mode; buildQueue(); render(); }; });

buildQueue();
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
